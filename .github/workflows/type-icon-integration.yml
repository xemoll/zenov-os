name: ZenovOS native type and icon integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zenov-type-icon-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify integration source
        run: |
          set -euo pipefail
          BASE=382e1c169b337bea587c0aba4ef4bd6c521f2ca6
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(sha256sum .github/scripts/type_icon_pass.py | cut -d' ' -f1)" = \
            fc4e6cf085e2d78eecef23b563e7afda17d4e4a219f8a3c0bc0d33418996d87e
          test "$(sha256sum .github/scripts/type_icon_post.py | cut -d' ' -f1)" = \
            164b68fd7ff3e776cafd333d281f2dc05e7789966d016b930c4ee66f590915b6
          test "$(sha256sum third_party/inter/OFL.txt | cut -d' ' -f1)" = \
            262481e844521b326f5ecd053e59b98c8b2da78c8ee1bdbb6e8174305e54935a
          git diff --name-only "$BASE" HEAD | sort > /tmp/bootstrap-files.txt
          printf '%s\n' \
            .github/scripts/type_icon_pass.py \
            .github/scripts/type_icon_post.py \
            .github/workflows/type-icon-integration.yml \
            third_party/inter/OFL.txt | sort > /tmp/expected-bootstrap-files.txt
          diff -u /tmp/expected-bootstrap-files.txt /tmp/bootstrap-files.txt

      - name: Install native toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils openssl qemu-system-x86

      - name: Apply deterministic type and icon pass
        run: |
          set -euo pipefail
          mkdir -p /tmp/type-icon-evidence/tree
          python3 .github/scripts/type_icon_post.py pre | tee /tmp/type-icon-evidence/pre-transform.log
          python3 .github/scripts/type_icon_pass.py | tee /tmp/type-icon-evidence/transform.log
          python3 .github/scripts/type_icon_post.py post | tee /tmp/type-icon-evidence/post-transform.log
          rm -f .github/scripts/type_icon_pass.py .github/scripts/type_icon_post.py
          git diff --check
          ! grep -q 'type-icon-transform-compat' tests/qemu_display_ui.sh
          paths=(
            .github/workflows/adaptive-display.yml
            kernel/parts/ui_apps.inc
            kernel/parts/ui_font.inc
            kernel/parts/ui_graphics_base.inc
            kernel/parts/ui_runtime.inc
            kernel/parts/ui_shell.inc
            kernel/parts/ui_theme.inc
            tests/qemu_display_ui.sh
            third_party/inter/OFL.txt
          )
          git diff --stat 382e1c169b337bea587c0aba4ef4bd6c521f2ca6 -- "${paths[@]}" | tee /tmp/type-icon-evidence/source-stat.txt
          git diff --binary 382e1c169b337bea587c0aba4ef4bd6c521f2ca6 -- "${paths[@]}" > /tmp/type-icon-evidence/source.diff
          sha256sum /tmp/type-icon-evidence/source.diff | tee /tmp/type-icon-evidence/source-diff-sha256.txt
          for path in "${paths[@]}"; do
            mkdir -p "/tmp/type-icon-evidence/tree/$(dirname "$path")"
            cp "$path" "/tmp/type-icon-evidence/tree/$path"
          done

      - name: Build strict native image
        run: |
          set -o pipefail
          make clean check 2>&1 | tee /tmp/type-icon-evidence/native-check.log

      - name: Run complete persistence and recovery QEMU matrix
        env:
          QEMU_PHASE_TIMEOUT_SECONDS: 180
        run: |
          set -o pipefail
          make qemu 2>&1 | tee /tmp/type-icon-evidence/qemu.log

      - name: Render and verify all display modes
        run: |
          set -o pipefail
          bash tests/qemu_display_ui.sh \
            build/zenov-os.img build/zenov-data.img build/qemu-type-icon \
            2>&1 | tee /tmp/type-icon-evidence/qemu-display.log

      - name: Inspect type and icon evidence
        run: |
          set -euo pipefail
          OUT=build/qemu-type-icon
          SERIAL="$OUT/serial.log"
          for marker in \
            UI_FONT_ATLAS_OK UI_FONT_WEIGHT_OK UI_FONT_METRICS_OK UI_ICON_SYSTEM_OK \
            'UI_FONT_GLYPH_COUNT 95' 'UI_ICON_COUNT 13' UI_MINIMAL_SHELL_OK \
            UI_ACCESSIBILITY_OK UI_START_FILTER_OK UI_ADAPTIVE_DISPLAY_OK UI_HYBRID_SCALER_OK \
            'UI_DISPLAY_MODE_COUNT 32' UI_DISPLAY_2K_READY UI_DISPLAY_4K_READY; do
            grep -q "$marker" "$SERIAL"
          done
          test ! -s "$OUT/qemu.stderr"
          grep -q '^ratio=' "$OUT/chrome-density-evidence.txt"
          grep -q '^matrix-minimum text=' "$OUT/theme-contrast-matrix.txt"
          cp "$OUT/serial.log" /tmp/type-icon-evidence/serial.log
          cp "$OUT/qemu.stderr" /tmp/type-icon-evidence/qemu.stderr
          cp "$OUT/framebuffer-sha256.txt" /tmp/type-icon-evidence/framebuffer-sha256.txt
          cp "$OUT/chrome-density-evidence.txt" /tmp/type-icon-evidence/chrome-density-evidence.txt
          cp "$OUT/launcher-morph-evidence.txt" /tmp/type-icon-evidence/launcher-morph-evidence.txt
          cp "$OUT/popup-vertical-coverage.txt" /tmp/type-icon-evidence/popup-vertical-coverage.txt
          cp "$OUT/theme-contrast-matrix.txt" /tmp/type-icon-evidence/theme-contrast-matrix.txt

      - name: Upload type and icon evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-type-icon-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          compression-level: 9
          path: |
            /tmp/type-icon-evidence
            build/qemu-type-icon/desktop-1920x1080.ppm
            build/qemu-type-icon/start-1920x1080.ppm
            build/qemu-type-icon/desktop-2560x1440.ppm
            build/qemu-type-icon/control-center-2560x1440.ppm
            build/qemu-type-icon/settings-1024x768.ppm
            build/qemu-type-icon/start-1024x768.ppm
            build/qemu-type-icon/start-search-1024x768.ppm
            build/qemu-type-icon/*.txt
            build/qemu-type-icon/*.log
            build/qemu-type-icon/*.stderr
