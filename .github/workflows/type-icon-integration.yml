name: ZenovOS native type and icon integration

on:
  push:
    branches:
      - agent/zenov-os-0.1.1-type-icon-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zenov-type-icon-integration
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify integration source
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 382e1c169b337bea587c0aba4ef4bd6c521f2ca6)" = \
            382e1c169b337bea587c0aba4ef4bd6c521f2ca6
          test "$(sha256sum .github/scripts/type_icon_pass.py | cut -d' ' -f1)" = \
            fc4e6cf085e2d78eecef23b563e7afda17d4e4a219f8a3c0bc0d33418996d87e
          git diff --name-only 382e1c169b337bea587c0aba4ef4bd6c521f2ca6 HEAD | sort > /tmp/bootstrap-files.txt
          printf '%s\n' \
            .github/scripts/type_icon_pass.py \
            .github/workflows/type-icon-integration.yml | sort > /tmp/expected-bootstrap-files.txt
          diff -u /tmp/expected-bootstrap-files.txt /tmp/bootstrap-files.txt

      - name: Install native toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils openssl qemu-system-x86

      - name: Apply deterministic type and icon pass
        run: |
          set -euo pipefail
          mkdir -p /tmp/type-icon-evidence/tree
          python3 .github/scripts/type_icon_pass.py | tee /tmp/type-icon-evidence/transform.log
          python3 - <<'PY'
          from pathlib import Path
          path = Path('kernel/parts/ui_font.inc')
          text = path.read_text(encoding='utf-8')
          header = '''/*
           * UI bitmap glyph subset derived from Inter Regular and SemiBold.
           * Copyright (c) 2016 The Inter Project Authors.
           * Licensed under the SIL Open Font License 1.1; see third_party/inter/OFL.txt.
           * This modified bitmap subset is not exposed under the reserved font family name.
           */
          '''
          path.write_text(header + text, encoding='utf-8')
          PY
          mkdir -p third_party/inter
          cat > third_party/inter/OFL.txt <<'OFL'
          Copyright (c) 2016 The Inter Project Authors (https://github.com/rsms/inter)

          This Font Software is licensed under the SIL Open Font License, Version 1.1.
          This license is copied below, and is also available with a FAQ at:
          http://scripts.sil.org/OFL

          -----------------------------------------------------------
          SIL OPEN FONT LICENSE Version 1.1 - 26 February 2007
          -----------------------------------------------------------

          PREAMBLE
          The goals of the Open Font License (OFL) are to stimulate worldwide
          development of collaborative font projects, to support the font creation
          efforts of academic and linguistic communities, and to provide a free and
          open framework in which fonts may be shared and improved in partnership
          with others.

          The OFL allows the licensed fonts to be used, studied, modified and
          redistributed freely as long as they are not sold by themselves. The
          fonts, including any derivative works, can be bundled, embedded,
          redistributed and/or sold with any software provided that any reserved
          names are not used by derivative works. The fonts and derivatives,
          however, cannot be released under any other type of license. The
          requirement for fonts to remain under this license does not apply
          to any document created using the fonts or their derivatives.

          DEFINITIONS
          "Font Software" refers to the set of files released by the Copyright
          Holder(s) under this license and clearly marked as such. This may
          include source files, build scripts and documentation.

          "Reserved Font Name" refers to any names specified as such after the
          copyright statement(s).

          "Original Version" refers to the collection of Font Software components as
          distributed by the Copyright Holder(s).

          "Modified Version" refers to any derivative made by adding to, deleting,
          or substituting -- in part or in whole -- any of the components of the
          Original Version, by changing formats or by porting the Font Software to a
          new environment.

          "Author" refers to any designer, engineer, programmer, technical
          writer or other person who contributed to the Font Software.

          PERMISSION AND CONDITIONS
          Permission is hereby granted, free of charge, to any person obtaining
          a copy of the Font Software, to use, study, copy, merge, embed, modify,
          redistribute, and sell modified and unmodified copies of the Font
          Software, subject to the following conditions:

          1) Neither the Font Software nor any of its individual components,
          in Original or Modified Versions, may be sold by itself.

          2) Original or Modified Versions of the Font Software may be bundled,
          redistributed and/or sold with any software, provided that each copy
          contains the above copyright notice and this license. These can be
          included either as stand-alone text files, human-readable headers or
          in the appropriate machine-readable metadata fields within text or
          binary files as long as those fields can be easily viewed by the user.

          3) No Modified Version of the Font Software may use the Reserved Font
          Name(s) unless explicit written permission is granted by the corresponding
          Copyright Holder. This restriction only applies to the primary font name as
          presented to the users.

          4) The name(s) of the Copyright Holder(s) or the Author(s) of the Font
          Software shall not be used to promote, endorse or advertise any
          Modified Version, except to acknowledge the contribution(s) of the
          Copyright Holder(s) and the Author(s) or with their explicit written
          permission.

          5) The Font Software, modified or unmodified, in part or in whole,
          must be distributed entirely under this license, and must not be
          distributed under any other license. The requirement for fonts to
          remain under this license does not apply to any document created
          using the Font Software.

          TERMINATION
          This license becomes null and void if any of the above conditions are
          not met.

          DISCLAIMER
          THE FONT SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND,
          EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO ANY WARRANTIES OF
          MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT
          OF COPYRIGHT, PATENT, TRADEMARK, OR OTHER RIGHT. IN NO EVENT SHALL THE
          COPYRIGHT HOLDER BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY,
          INCLUDING ANY GENERAL, SPECIAL, INDIRECT, INCIDENTAL, OR CONSEQUENTIAL
          DAMAGES, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING
          FROM, OUT OF THE USE OR INABILITY TO USE THE FONT SOFTWARE OR FROM
          OTHER DEALINGS IN THE FONT SOFTWARE.
          OFL
          sed -i 's/^          //' third_party/inter/OFL.txt
          git diff --check
          paths=(
            .github/workflows/adaptive-display.yml
            kernel/parts/ui_apps.inc
            kernel/parts/ui_font.inc
            kernel/parts/ui_graphics_base.inc
            kernel/parts/ui_runtime.inc
            kernel/parts/ui_shell.inc
            kernel/parts/ui_theme.inc
            tests/qemu_display_ui.sh
            third_party/inter/OFL.txt
          )
          git diff --stat 382e1c169b337bea587c0aba4ef4bd6c521f2ca6 -- "${paths[@]}" | tee /tmp/type-icon-evidence/source-stat.txt
          git diff --binary 382e1c169b337bea587c0aba4ef4bd6c521f2ca6 -- "${paths[@]}" > /tmp/type-icon-evidence/source.diff
          sha256sum /tmp/type-icon-evidence/source.diff | tee /tmp/type-icon-evidence/source-diff-sha256.txt
          for path in "${paths[@]}"; do
            mkdir -p "/tmp/type-icon-evidence/tree/$(dirname "$path")"
            cp "$path" "/tmp/type-icon-evidence/tree/$path"
          done

      - name: Build strict native image
        run: |
          set -o pipefail
          make clean check 2>&1 | tee /tmp/type-icon-evidence/native-check.log

      - name: Run complete persistence and recovery QEMU matrix
        env:
          QEMU_PHASE_TIMEOUT_SECONDS: 180
        run: |
          set -o pipefail
          make qemu 2>&1 | tee /tmp/type-icon-evidence/qemu.log

      - name: Render and verify all display modes
        run: |
          set -o pipefail
          bash tests/qemu_display_ui.sh \
            build/zenov-os.img build/zenov-data.img build/qemu-type-icon \
            2>&1 | tee /tmp/type-icon-evidence/qemu-display.log

      - name: Inspect type and icon evidence
        run: |
          set -euo pipefail
          OUT=build/qemu-type-icon
          SERIAL="$OUT/serial.log"
          for marker in \
            UI_FONT_ATLAS_OK UI_FONT_WEIGHT_OK UI_FONT_METRICS_OK UI_ICON_SYSTEM_OK \
            'UI_FONT_GLYPH_COUNT 95' 'UI_ICON_COUNT 13' UI_MINIMAL_SHELL_OK \
            UI_ACCESSIBILITY_OK UI_START_FILTER_OK UI_ADAPTIVE_DISPLAY_OK UI_HYBRID_SCALER_OK \
            'UI_DISPLAY_MODE_COUNT 32' UI_DISPLAY_2K_READY UI_DISPLAY_4K_READY; do
            grep -q "$marker" "$SERIAL"
          done
          test ! -s "$OUT/qemu.stderr"
          grep -q '^ratio=' "$OUT/chrome-density-evidence.txt"
          grep -q '^matrix-minimum text=' "$OUT/theme-contrast-matrix.txt"
          cp "$OUT/serial.log" /tmp/type-icon-evidence/serial.log
          cp "$OUT/qemu.stderr" /tmp/type-icon-evidence/qemu.stderr
          cp "$OUT/framebuffer-sha256.txt" /tmp/type-icon-evidence/framebuffer-sha256.txt
          cp "$OUT/chrome-density-evidence.txt" /tmp/type-icon-evidence/chrome-density-evidence.txt
          cp "$OUT/launcher-morph-evidence.txt" /tmp/type-icon-evidence/launcher-morph-evidence.txt
          cp "$OUT/popup-vertical-coverage.txt" /tmp/type-icon-evidence/popup-vertical-coverage.txt
          cp "$OUT/theme-contrast-matrix.txt" /tmp/type-icon-evidence/theme-contrast-matrix.txt

      - name: Upload type and icon evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-type-icon-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          compression-level: 9
          path: |
            /tmp/type-icon-evidence
            build/qemu-type-icon/desktop-1920x1080.ppm
            build/qemu-type-icon/start-1920x1080.ppm
            build/qemu-type-icon/desktop-2560x1440.ppm
            build/qemu-type-icon/control-center-2560x1440.ppm
            build/qemu-type-icon/settings-1024x768.ppm
            build/qemu-type-icon/start-1024x768.ppm
            build/qemu-type-icon/start-search-1024x768.ppm
            build/qemu-type-icon/*.txt
            build/qemu-type-icon/*.log
            build/qemu-type-icon/*.stderr
