name: ZenovOS type and icon publication

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zenov-type-icon-publication
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-verified-tree:
    if: github.head_ref == 'agent/zenov-os-0.1.1-type-icon-integration' || github.ref_name == 'agent/zenov-os-0.1.1-type-icon-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct exact verified production tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/type-icon-publication /tmp/type-icon-bootstrap
          cp .github/scripts/type_icon_pass.py .github/scripts/type_icon_post.py /tmp/type-icon-bootstrap/
          cp third_party/inter/OFL.txt /tmp/type-icon-bootstrap/OFL.txt
          test "$(sha256sum /tmp/type-icon-bootstrap/type_icon_pass.py | cut -d' ' -f1)" = \
            fc4e6cf085e2d78eecef23b563e7afda17d4e4a219f8a3c0bc0d33418996d87e
          test "$(sha256sum /tmp/type-icon-bootstrap/type_icon_post.py | cut -d' ' -f1)" = \
            164b68fd7ff3e776cafd333d281f2dc05e7789966d016b930c4ee66f590915b6
          git fetch origin main agent/zenov-os-0.1.1-cohesive-ui-polish
          MAIN_HEAD="$(git rev-parse origin/main)"
          test "$MAIN_HEAD" = f0d4328bfcb1a3684da58234afc58b6563861cb2
          printf '%s\n' "$MAIN_HEAD" > /tmp/type-icon-publication/main-head.txt
          base_paths=(
            .github/workflows/adaptive-display.yml
            kernel/parts/graphics_mapping.inc
            kernel/parts/mouse_regression.inc
            kernel/parts/ui_apps.inc
            kernel/parts/ui_files.inc
            kernel/parts/ui_files_runtime.inc
            kernel/parts/ui_font.inc
            kernel/parts/ui_graphics_base.inc
            kernel/parts/ui_runtime.inc
            kernel/parts/ui_scaler.inc
            kernel/parts/ui_shell.inc
            kernel/parts/ui_theme.inc
            tests/qemu_display_ui.sh
            tests/qemu_zenpkg.sh
          )
          git diff --binary \
            77f00d46fc9f6a84c7f2885db7603f746687c034 \
            382e1c169b337bea587c0aba4ef4bd6c521f2ca6 \
            -- "${base_paths[@]}" > /tmp/type-icon-publication/minimal-shell.patch
          test -s /tmp/type-icon-publication/minimal-shell.patch
          git reset --hard "$MAIN_HEAD"
          git clean -fdx
          git apply --3way /tmp/type-icon-publication/minimal-shell.patch
          mkdir -p .github/scripts third_party/inter
          cp /tmp/type-icon-bootstrap/type_icon_pass.py .github/scripts/
          cp /tmp/type-icon-bootstrap/type_icon_post.py .github/scripts/
          cp /tmp/type-icon-bootstrap/OFL.txt third_party/inter/OFL.txt
          git add -N third_party/inter/OFL.txt
          python3 .github/scripts/type_icon_post.py pre | tee /tmp/type-icon-publication/pre-transform.log
          python3 .github/scripts/type_icon_pass.py | tee /tmp/type-icon-publication/transform.log
          python3 .github/scripts/type_icon_post.py post | tee /tmp/type-icon-publication/post-transform.log
          rm -f .github/scripts/type_icon_pass.py .github/scripts/type_icon_post.py
          git diff --check
          paths=(
            .github/workflows/adaptive-display.yml
            kernel/parts/graphics_mapping.inc
            kernel/parts/mouse_regression.inc
            kernel/parts/ui_apps.inc
            kernel/parts/ui_files.inc
            kernel/parts/ui_files_runtime.inc
            kernel/parts/ui_font.inc
            kernel/parts/ui_graphics_base.inc
            kernel/parts/ui_runtime.inc
            kernel/parts/ui_scaler.inc
            kernel/parts/ui_shell.inc
            kernel/parts/ui_theme.inc
            tests/qemu_display_ui.sh
            tests/qemu_zenpkg.sh
            third_party/inter/OFL.txt
          )
          mapfile -t actual < <(git diff "$MAIN_HEAD" --name-only | sort)
          mapfile -t expected < <(printf '%s\n' "${paths[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          git diff --binary "$MAIN_HEAD" -- "${paths[@]}" > /tmp/type-icon-publication/source.diff
          test "$(sha256sum /tmp/type-icon-publication/source.diff | cut -d' ' -f1)" = \
            b4eb082931e67bb2f40107deeafec57055c2e4a0ba2f373dd6d468fd1d6e6fa4
          git diff --stat "$MAIN_HEAD" -- "${paths[@]}" | tee /tmp/type-icon-publication/source-stat.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${paths[@]}"
          git diff --cached --check
          git commit -m 'ui: add native typography and unified iconography'
          FINAL_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$MAIN_HEAD"
          printf '%s\n' "$FINAL_HEAD" | tee /tmp/type-icon-publication/final-head.txt
          git rev-parse 'HEAD^{tree}' | tee /tmp/type-icon-publication/tree-sha.txt
          git diff-tree --no-commit-id --name-only -r HEAD | sort | tee /tmp/type-icon-publication/final-files.txt
          git show --stat --oneline --summary HEAD | tee /tmp/type-icon-publication/final-commit.txt

      - name: Transfer commit object and publish if permitted
        run: |
          set -euo pipefail
          FINAL_HEAD="$(cat /tmp/type-icon-publication/final-head.txt)"
          set +e
          git push --force-with-lease=refs/heads/agent/zenov-os-0.1.1-cohesive-ui-polish:382e1c169b337bea587c0aba4ef4bd6c521f2ca6 \
            origin "$FINAL_HEAD":agent/zenov-os-0.1.1-cohesive-ui-polish \
            > /tmp/type-icon-publication/push.log 2>&1
          status=$?
          set -e
          cat /tmp/type-icon-publication/push.log
          printf '%s\n' "$status" > /tmp/type-icon-publication/push-status.txt
          if [[ $status -ne 0 ]]; then
            grep -q 'without `workflows` permission' /tmp/type-icon-publication/push.log
          fi

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-type-icon-publication-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 9
          path: /tmp/type-icon-publication
