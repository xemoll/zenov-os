name: Runtime ABI v2 staging gate

on:
  push:
    branches:
      - feature/runtime-provider-abi-v2-hardening
    paths:
      - '.v2-staging/**'
      - '.github/workflows/runtime-abi-v2-staging.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.v2-staging/**'
      - '.github/workflows/runtime-abi-v2-staging.yml'
  workflow_dispatch:

concurrency:
  group: runtime-abi-v2-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ZENOV_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  apply-verified-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ZENOV_SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact staging revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZENOV_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ZENOV_SOURCE_REVISION"
          test -z "$(git status --porcelain=v1)"

      - name: Install strict toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential clang

      - name: Reconstruct and validate bounded payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs /tmp/runtime-abi-v2
          cat .v2-staging/payload.00 .v2-staging/payload.01 .v2-staging/payload.02 .v2-staging/payload.03 \
            | tr -d '\r\n' | base64 --decode > /tmp/runtime-abi-v2/payload.tar.gz
          echo '69d3b1c2c066dddff89254e2128a93d466833e5373a7f75e5a6b6ff185b280e1  /tmp/runtime-abi-v2/payload.tar.gz' \
            | sha256sum --check | tee ci-logs/payload-sha256.log

          tar -tzf /tmp/runtime-abi-v2/payload.tar.gz | LC_ALL=C sort > ci-logs/archive-files.txt
          cat > ci-logs/expected-files.txt <<'EOF'
          .github/workflows/zenuniverse.yml
          docs/RUNTIME_PROVIDER_ABI_V2_0.1.1.md
          packages/universe/runtime-duckstation.zsource
          packages/universe/runtime-pcsx2.zsource
          tests/zenuniverse_runtime_provider_test.sh
          tools/zenuniverse/artifact_manifest.hpp
          tools/zenuniverse/common.hpp
          tools/zenuniverse/descriptor.hpp
          tools/zenuniverse/launch_manifest.hpp
          tools/zenuniverse/main.cpp
          tools/zenuniverse/native_artifact.hpp
          tools/zenuniverse/resolver.hpp
          universe.mk
          EOF
          sed -i 's/^          //' ci-logs/expected-files.txt
          LC_ALL=C sort -o ci-logs/expected-files.txt ci-logs/expected-files.txt
          cmp ci-logs/expected-files.txt ci-logs/archive-files.txt
          ! grep -Eq '(^/|(^|/)\.\.(/|$))' ci-logs/archive-files.txt

          mkdir -p /tmp/runtime-abi-v2/extracted
          tar -xzf /tmp/runtime-abi-v2/payload.tar.gz -C /tmp/runtime-abi-v2/extracted --no-same-owner --no-same-permissions
          while IFS= read -r path; do
            test -f "/tmp/runtime-abi-v2/extracted/$path"
            mkdir -p "$(dirname "$path")"
            cp "/tmp/runtime-abi-v2/extracted/$path" "$path"
          done < ci-logs/expected-files.txt
          chmod +x tests/zenuniverse_runtime_provider_test.sh

      - name: Run complete Runtime Provider ABI v2 gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build /tmp/zenuniverse-v2-rebuild
          make --no-print-directory universe-check 2>&1 | tee ci-logs/universe-check.log
          make --no-print-directory BUILD=/tmp/zenuniverse-v2-rebuild universe-check \
            2>&1 | tee ci-logs/universe-rebuild.log
          cmp build/zenuniverse.zuc /tmp/zenuniverse-v2-rebuild/zenuniverse.zuc
          grep -Fq 'ZENUNIVERSE_RUNTIME_PROVIDER_V2_OK manifest=catalog-bound profile=version-bound provider=version-bound native=zenpkg-validated foreign=zenpkg-classified launch=sealed assets=size-constrained drift=blocked tamper=blocked sanitizers=yes' ci-logs/universe-check.log
          grep -Fq 'ZENUNIVERSE_RUNTIME_PROVIDER_V2_OK manifest=catalog-bound profile=version-bound provider=version-bound native=zenpkg-validated foreign=zenpkg-classified launch=sealed assets=size-constrained drift=blocked tamper=blocked sanitizers=yes' ci-logs/universe-rebuild.log
          grep -Fq '^ZENARTIFACT2$' build/zenuniverse-runtime-test/fixtures/hello.zartifact
          grep -Fq '^ZENLAUNCH2$' build/zenuniverse-runtime-test/fixtures/hello.zlaunch
          grep -Fq 'native artifact violates ZenPkg loader contract' build/zenuniverse-runtime-test/fake-magic.log
          grep -Fq 'declared artifact family does not match ZenPkg classifier' build/zenuniverse-runtime-test/fake-chd.log
          grep -Fq 'catalog SHA-256 mismatch' build/zenuniverse-runtime-test/drift.log
          grep -Fq 'shape=invalid' build/zenuniverse-runtime-test/ps1-wrong-bios.log
          grep -Fq 'shape=valid' build/zenuniverse-runtime-test/ps1-shape-bios.log
          test -z "$(find tools tests packages docs .github -type l -print -quit)"

      - name: Commit verified production tree
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zenov-runtime-gate'
          git config user.email 'runtime-gate@users.noreply.github.com'
          while IFS= read -r path; do git add -- "$path"; done < ci-logs/expected-files.txt
          git rm .v2-staging/payload.00 .v2-staging/payload.01 .v2-staging/payload.02 .v2-staging/payload.03
          git diff --cached --name-only | LC_ALL=C sort > ci-logs/committed-files.txt
          cat ci-logs/expected-files.txt > ci-logs/allowed-commit-files.txt
          printf '%s\n' \
            '.v2-staging/payload.00' \
            '.v2-staging/payload.01' \
            '.v2-staging/payload.02' \
            '.v2-staging/payload.03' >> ci-logs/allowed-commit-files.txt
          LC_ALL=C sort -o ci-logs/allowed-commit-files.txt ci-logs/allowed-commit-files.txt
          cmp ci-logs/allowed-commit-files.txt ci-logs/committed-files.txt
          git commit -m 'ZenPkg: bind runtime artifacts and launch plans to exact catalog'
          git push origin HEAD:refs/heads/feature/runtime-provider-abi-v2-hardening

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: runtime-abi-v2-staging-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ci-logs/
            build/zenuniverse-runtime-test/
            build/zenuniverse.zuc
            /tmp/zenuniverse-v2-rebuild/zenuniverse.zuc
