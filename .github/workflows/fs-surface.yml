name: ZenovOS Filesystem Result Surface

on:
  push:
    branches:
      - main
    paths:
      - 'GNUmakefile'
      - 'fs_surface.mk'
      - 'kernel/kernel.cpp'
      - 'kernel/parts/storage.inc'
      - 'kernel/parts/storage_diagnostics.inc'
      - 'kernel/parts/storage_fs_surface.inc'
      - 'kernel/parts/security_result_paths.inc'
      - 'kernel/parts/storage_result_commands.inc'
      - 'tests/storage_fs_surface_test.cpp'
      - 'tests/qemu_fs_surface.sh'
      - '.github/workflows/fs-surface.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'GNUmakefile'
      - 'fs_surface.mk'
      - 'kernel/kernel.cpp'
      - 'kernel/parts/storage.inc'
      - 'kernel/parts/storage_diagnostics.inc'
      - 'kernel/parts/storage_fs_surface.inc'
      - 'kernel/parts/security_result_paths.inc'
      - 'kernel/parts/storage_result_commands.inc'
      - 'tests/storage_fs_surface_test.cpp'
      - 'tests/qemu_fs_surface.sh'
      - '.github/workflows/fs-surface.yml'
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: '0'

jobs:
  fs-result-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZENOV_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ZENOV_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact tested source revision
        run: |
          set -euo pipefail
          [[ "$ZENOV_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ZENOV_SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          echo "tested-source-revision=$ZENOV_SOURCE_REVISION"

      - name: Install strict native and QEMU toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils qemu-system-x86

      - name: Validate harness syntax
        run: bash -n tests/qemu_fs_surface.sh

      - name: Run surface contract under sanitizers
        run: |
          set -euo pipefail
          mkdir -p build/fs-surface ci-logs
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -Wpedantic \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer tests/storage_fs_surface_test.cpp \
            -o build/fs-surface/storage-fs-surface-test
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            build/fs-surface/storage-fs-surface-test \
            2>&1 | tee ci-logs/fs-surface-sanitized.log
          grep -Fq 'ZENOVFS_SURFACE_TEST_OK cases=19 classes=10 status=distinct' \
            ci-logs/fs-surface-sanitized.log

      - name: Build strict native system
        run: |
          set -euo pipefail
          rm -f /tmp/fs-surface-native-check.log
          make clean check 2>&1 | tee /tmp/fs-surface-native-check.log
          cp /tmp/fs-surface-native-check.log ci-logs/native-check.log
          grep -Fq 'ZENOVFS_SURFACE_TEST_OK cases=19 classes=10 status=distinct' \
            ci-logs/native-check.log
          grep -Fq 'ZENOVFS_RESULT_TEST_OK' ci-logs/native-check.log
          grep -Fq 'BLOCK_DEVICE_ABI_TEST_OK' ci-logs/native-check.log

      - name: Boot and verify distinct shell results
        run: |
          set -euo pipefail
          make fs-surface-qemu 2>&1 | tee ci-logs/fs-surface-qemu.log

      - name: Verify runtime evidence
        run: |
          set -euo pipefail
          out=build/qemu/fs-surface
          test -s "$out/serial.log"
          test -s "$out/summary.log"
          grep -Fq 'ZENOVFS_SHELL_RESULT_OK cases=5 classes=caller,missing,policy sync=1 fsck=1' \
            "$out/summary.log"
          test "$(grep -Fc 'FS_COMMAND_FAILED action=' "$out/serial.log")" -eq 5
          grep -Fq 'ZENOVFS_SURFACE_CONTRACT_OK version=1' "$out/serial.log"
          grep -Fq 'ZENOVFS_SURFACE_API_OK version=1' "$out/serial.log"
          grep -Fq 'ZENOVFS_RESULT_COUNTERS_OK' "$out/serial.log"
          test ! -s "$out/qemu.stderr"

      - name: Upload filesystem surface evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fs-result-surface-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ci-logs/
            build/qemu/fs-surface/
