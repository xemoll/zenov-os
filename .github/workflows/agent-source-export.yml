name: Apply Scheduler Kernel Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/agent-source-export.yml'
      - '.github/agent-scheduler.patch.gz.b64.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-scheduler-kernel-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/kernel-preemptive-scheduler-0.1.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/kernel-preemptive-scheduler-0.1.1
          fetch-depth: 0
          persist-credentials: true

      - name: Validate and apply exact scheduler patch
        shell: bash
        env:
          BASE_SHA: 9d18cc34fb41ebced5a3011e1b37bc55672dbafa
          PATCH_SHA256: 5b53eaa476a1aa47b1e35c07731a9a23259129f76cca8ca39fe8d3a3dccfc91f
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --quiet "$BASE_SHA" -- . \
            ':(exclude).github/workflows/agent-source-export.yml' \
            ':(exclude).github/agent-scheduler.patch.gz.b64.*'

          cat .github/agent-scheduler.patch.gz.b64.* \
            | base64 --decode \
            | gzip --decompress > /tmp/scheduler.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/scheduler.patch | sha256sum --check --strict

          # The patch intentionally deletes this temporary workflow. Restore
          # its exact base revision so the deletion hunk remains atomic.
          git checkout "$BASE_SHA" -- .github/workflows/agent-source-export.yml
          git apply --check /tmp/scheduler.patch
          git apply --index /tmp/scheduler.patch
          git rm -f .github/agent-scheduler.patch.gz.b64.*

          test ! -e .github/workflows/agent-source-export.yml
          test ! -e .github/agent-scheduler.patch.gz.b64.00
          git diff --cached --check
          git status --short

      - name: Publish one atomic kernel commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZenovOS Kernel Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'kernel: add preemptive scheduler and isolated tasks'
          git push origin HEAD:refs/heads/agent/kernel-preemptive-scheduler-0.1.1
