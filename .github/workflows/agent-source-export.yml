name: Agent Source Export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/agent-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          printf '%s\n' "$(git rev-parse HEAD)" > AGENT_SOURCE_SHA
          tar --exclude=.git --exclude=agent-source.tar.gz -czf agent-source.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-source-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: agent-source.tar.gz
