name: Security current-main source snapshot

on:
  pull_request:
  push:
    branches:
      - agent/security-current-main-snapshot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5eac0bee73a46e7b132f0694322bf7c4531bd63b
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source and archive
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5eac0bee73a46e7b132f0694322bf7c4531bd63b
          printf '%s\n' 5eac0bee73a46e7b132f0694322bf7c4531bd63b > /tmp/SOURCE-REVISION.txt
          tar --exclude=.git -czf /tmp/security-current-main-source.tar.gz .
          sha256sum /tmp/security-current-main-source.tar.gz > /tmp/security-current-main-source.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-current-main-source-5eac0bee
          if-no-files-found: error
          path: |
            /tmp/security-current-main-source.tar.gz
            /tmp/security-current-main-source.tar.gz.sha256
            /tmp/SOURCE-REVISION.txt
