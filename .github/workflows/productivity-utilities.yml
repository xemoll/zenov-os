name: ZenovOS 0.1.1 Productivity Utilities

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  productivity-utilities:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZENOV_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ZENOV_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tested source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZENOV_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ZENOV_SOURCE_REVISION"
          git cat-file -e "$ZENOV_SOURCE_REVISION^{commit}"
          test -z "$(git status --porcelain=v1)"

      - name: Install strict toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils clang openssl qemu-system-x86

      - name: Validate calculator and reminder model with GCC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/productivity-utilities-model
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wpedantic \
            tests/productivity_utilities_model.cpp -o build/productivity-utilities-model/model-gcc
          build/productivity-utilities-model/model-gcc | tee build/productivity-utilities-model/model-gcc.log
          grep -Fqx 'PRODUCTIVITY_UTILITIES_MODEL_OK calc=precedence+programmer+overflow date=gregorian reminders=v2+backward+recurrence+quick-add agenda=minute-order+seven-day' \
            build/productivity-utilities-model/model-gcc.log

      - name: Validate model with Clang sanitizers
        shell: bash
        run: |
          set -euo pipefail
          sanitizer=(-std=c++17 -O1 -g -Wall -Wextra -Werror -Wpedantic
            -fsanitize=address,undefined,unsigned-integer-overflow,implicit-unsigned-integer-truncation,implicit-signed-integer-truncation,implicit-integer-sign-change
            -fno-sanitize-recover=all -fno-omit-frame-pointer)
          clang++ "${sanitizer[@]}" tests/productivity_utilities_model.cpp \
            -o build/productivity-utilities-model/model-clang
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            build/productivity-utilities-model/model-clang | tee build/productivity-utilities-model/model-clang.log
          grep -Fqx 'PRODUCTIVITY_UTILITIES_MODEL_OK calc=precedence+programmer+overflow date=gregorian reminders=v2+backward+recurrence+quick-add agenda=minute-order+seven-day' \
            build/productivity-utilities-model/model-clang.log

      - name: Validate freestanding 64-bit divmod ABI
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wpedantic \
            tests/div64_runtime_test.cpp -o build/productivity-utilities-model/div64-runtime-test
          build/productivity-utilities-model/div64-runtime-test | tee build/productivity-utilities-model/div64-runtime-test.log
          grep -Fqx 'DIV64_RUNTIME_OK abi=udivdi3+udivmoddi4+umoddi3 edges=64bit freestanding=link-closed' \
            build/productivity-utilities-model/div64-runtime-test.log
          g++ -m32 -std=c++17 -Os -Wall -Wextra -Werror -Wpedantic \
            -DDIV64_LINK_ONLY -ffreestanding -fno-exceptions -fno-rtti -fno-stack-protector \
            -fno-pic -fno-pie -fno-threadsafe-statics -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -nostdlib -c tests/div64_runtime_test.cpp -o build/productivity-utilities-model/div64-runtime-link.o
          test -z "$(nm -u build/productivity-utilities-model/div64-runtime-link.o)"
          nm -g --defined-only build/productivity-utilities-model/div64-runtime-link.o | grep -Fq ' __udivmoddi4'
          nm -g --defined-only build/productivity-utilities-model/div64-runtime-link.o | grep -Fq ' __umoddi3'

      - name: Build strict native image
        run: make clean check

      - name: Compile runtime-image verifier
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -Wpedantic \
            tools/zenovfs_productivity_utilities_verify.cpp -o build/zenovfs-productivity-utilities-verify

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '#include "ui_productivity_utilities.inc"' kernel/parts/graphics.inc
          grep -Fq '#define render_scene render_scene_tasks_base' kernel/parts/graphics.inc
          grep -Fq 'constexpr uint8_t productivity_reminder_capacity = 24U;' kernel/parts/ui_productivity_utilities_types.inc
          grep -Fq 'enum class ProductivityReminderRepeat' kernel/parts/ui_productivity_utilities_types.inc
          grep -Fq 'storage::security_read_file("/reminders/reminders.db"' kernel/parts/ui_productivity_reminders_format.inc
          grep -Fq 'storage::guarded_write_file("/reminders/reminders.db"' kernel/parts/ui_productivity_reminders_format.inc
          grep -Fq 'productivity_reminder_parse_quick' kernel/parts/ui_productivity_reminders_format.inc
          grep -Fq 'UI_REMINDER_REPEAT_ADVANCE_OK' kernel/parts/ui_productivity_reminders_actions.inc
          grep -Fq 'ProductivityReminderFilter::week' kernel/parts/ui_productivity_reminders_agenda.inc
          grep -Fq 'storage::guarded_write_file("/utilities/calculator.state"' kernel/parts/ui_productivity_calculator_state.inc
          grep -Fq 'productivity_launcher_query_is("calculator")' kernel/parts/ui_productivity_utilities_runtime.inc
          grep -Fq 'productivity_launcher_query_is("reminders")' kernel/parts/ui_productivity_utilities_runtime.inc
          grep -Fq 'UI_PRODUCTIVITY_UTILITIES_READY calculator=standard+programmer+date+units reminders=smart+agenda+recurrence+quick-capture' kernel/parts/ui_productivity_utilities_runtime.inc
          echo 'PRODUCTIVITY_UTILITIES_SOURCE_CONTRACT_OK calculator=bounded reminders=v2+backward+recurrence+quick-add agenda=integrated+seven-day reads=guarded writes=guarded div64=link-closed'

      - name: Exercise Calculator, Reminders and Agenda
        run: bash tests/qemu_productivity_utilities.sh build/zenov-os.img build/zenov-data.img build/qemu-productivity-utilities

      - name: Verify persistent utility state
        shell: bash
        run: |
          set -euo pipefail
          build/zenovfs-verify build/qemu-productivity-utilities/zenov-data-utilities.img | tee build/qemu-productivity-utilities/zenovfs-verify.log
          build/zenovfs-productivity-utilities-verify build/qemu-productivity-utilities/zenov-data-utilities.img | tee build/qemu-productivity-utilities/utilities-verify.log
          grep -Fq 'ZENOV_PRODUCTIVITY_UTILITIES_RUNTIME_IMAGE_OK calculator=history+memory reminders=v2+one-shot+daily recurrence=advanced reboot=persistent checksum=valid geometry=bounded' \
            build/qemu-productivity-utilities/utilities-verify.log
          grep -Fq 'UI_CALCULATOR_EVAL_OK' build/qemu-productivity-utilities/serial-phase1.log
          grep -Fq 'UI_REMINDER_ALARM_DUE' build/qemu-productivity-utilities/serial-phase1.log
          grep -Fq 'UI_REMINDER_REPEAT_ADVANCE_OK' build/qemu-productivity-utilities/serial-phase1.log
          grep -Fq 'UI_REMINDERS_LOAD_OK' build/qemu-productivity-utilities/serial-phase2.log
          test -s build/qemu-productivity-utilities/calculator-standard.ppm
          test -s build/qemu-productivity-utilities/calculator-programmer.ppm
          test -s build/qemu-productivity-utilities/calculator-date.ppm
          test -s build/qemu-productivity-utilities/calculator-units.ppm
          test -s build/qemu-productivity-utilities/reminders-quick-add.ppm
          test -s build/qemu-productivity-utilities/reminders-quick-add-recurring.ppm
          test -s build/qemu-productivity-utilities/reminders-recurring-alarm.ppm
          test -s build/qemu-productivity-utilities/reminders-week.ppm
          test -s build/qemu-productivity-utilities/reminders-recurring-persisted.ppm
          test ! -s build/qemu-productivity-utilities/qemu-phase1.stderr
          test ! -s build/qemu-productivity-utilities/qemu-phase2.stderr

      - name: Verify deterministic rebuild
        run: make deterministic

      - name: Upload productivity utility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-0.1.1-productivity-utilities-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            build/zenov-os.img
            build/zenov-data.img
            build/KERNEL.BIN
            build/zenovfs-productivity-utilities-verify
            build/productivity-utilities-model/*
            build/qemu-productivity-utilities/*.img
            build/qemu-productivity-utilities/*.log
            build/qemu-productivity-utilities/*.stderr
            build/qemu-productivity-utilities/*.ppm
            kernel/parts/div64_runtime.inc
            kernel/parts/graphics.inc
            kernel/parts/ui_productivity_utilities*.inc
            kernel/parts/ui_productivity_calculator*.inc
            kernel/parts/ui_productivity_reminders*.inc
            tests/div64_runtime_test.cpp
            tests/productivity_utilities_model.cpp
            tests/productivity_utilities_model_*.inc
            tests/qemu_productivity_utilities.sh
            tools/zenovfs_productivity_utilities_verify.cpp
