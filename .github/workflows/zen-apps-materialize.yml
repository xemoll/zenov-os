name: Materialize cross-platform Zen Apps

on:
  push:
    branches:
      - agent/cross-platform-zen-apps
    paths:
      - '.zen-apps-staging/**'
  pull_request:
    branches:
      - main
    paths:
      - '.zen-apps-staging/**'
      - '.github/workflows/zen-apps-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/cross-platform-zen-apps
          fetch-depth: 0

      - name: Detect staging payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          if test -f .zen-apps-staging/chunk-00; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify source payload
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .zen-apps-staging/chunk-* > /tmp/zen-apps.tar.gz.b64
          base64 --decode /tmp/zen-apps.tar.gz.b64 > /tmp/zen-apps.tar.gz
          printf '%s  %s\n' \
            '89c50131d9973c9d9f0e36f50d700503b3c17b4b8ec23909ff9d3d07f8c7bb5d' \
            '/tmp/zen-apps.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/zen-apps.tar.gz
          test -f desktop/CMakeLists.txt
          test -f desktop/src/main.cpp
          test -f desktop/tests/core_tests.cpp
          test -f desktop/packaging/arch/PKGBUILD
          echo 'ZEN_APPS_PAYLOAD_OK sha256=89c50131d9973c9d9f0e36f50d700503b3c17b4b8ec23909ff9d3d07f8c7bb5d'

      - name: Install Linux GUI dependencies
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 xvfb

      - name: Install Qt
        if: steps.payload.outputs.present == 'true'
        uses: jurplel/install-qt-action/action@26d6394617249cc034008e532a6d07cf77e19ff7
        with:
          version: '6.8.3'
          cache: true

      - name: Build with strict warnings
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S desktop -B build/desktop -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZEN_APPS_WARNINGS_AS_ERRORS=ON
          cmake --build build/desktop --parallel 2

      - name: Run core and application smoke tests
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/desktop --output-on-failure
          mkdir -p build/zen-apps-smoke build/zen-apps-shots
          export QT_QPA_PLATFORM=offscreen
          export ZEN_APPS_DATA_DIR="$PWD/build/zen-apps-smoke"
          for app in zen-notes zen-tasks zen-calendar zen-clock zen-calculator zen-reminders; do
            "build/desktop/$app" --smoke-test
            "build/desktop/$app" --screenshot "$PWD/build/zen-apps-shots/$app.png"
            test -s "build/zen-apps-shots/$app.png"
          done
          test -s build/zen-apps-smoke/workspace.sqlite
          echo 'ZEN_APPS_LINUX_SMOKE_OK apps=6 storage=sqlite screenshots=6'

      - name: Upload staging verification evidence
        if: steps.payload.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zen-apps-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            build/zen-apps-shots/*.png
            build/zen-apps-smoke/workspace.sqlite

      - name: Publish clean source commit to feature branch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .zen-apps-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop .zen-apps-staging
          git diff --cached --check
          git commit -m 'Desktop: add standalone cross-platform productivity apps'
          git push origin HEAD:agent/cross-platform-zen-apps
