name: ZenovOS System Apps

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  system-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain=v1)"

      - name: Install strict toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils clang openssl qemu-system-x86

      - name: Run calendar and editor models under sanitizers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -Wpedantic \
            -fsanitize=address,undefined,unsigned-integer-overflow,implicit-unsigned-integer-truncation,implicit-signed-integer-truncation,implicit-integer-sign-change \
            -fno-sanitize-recover=all -fno-omit-frame-pointer \
            tests/productivity_apps_test.cpp -o ci-logs/productivity-apps-test
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ci-logs/productivity-apps-test | tee ci-logs/productivity-apps-test.log
          grep -Fq 'PRODUCTIVITY_APPS_MODEL_OK calendar=gregorian editor=bounded links=2 tags=2' ci-logs/productivity-apps-test.log

      - name: Run strict host and freestanding checks
        run: make clean check

      - name: Prove system apps and reboot persistence in QEMU
        run: bash tests/qemu_system_apps.sh build/zenov-os.img build/zenov-data.img build/qemu-system-apps | tee ci-logs/qemu-system-apps.log

      - name: Verify deterministic rebuild
        run: make deterministic

      - name: Verify system-app source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'constexpr unsigned int editor_capacity = 2048U;' kernel/parts/ui_productivity_model.inc
          grep -Fq 'storage::guarded_read_file_result' kernel/parts/ui_productivity_state.inc
          grep -Fq 'storage::guarded_write_file_result' kernel/parts/ui_productivity_state.inc
          grep -Fq 'storage::sync_metadata()' kernel/parts/ui_productivity_state.inc
          grep -Fq 'UI_PRODUCTIVITY_LOAD_OK path=' kernel/parts/ui_productivity_state.inc
          grep -Fq 'UI_PRODUCTIVITY_SAVE_OK path=' kernel/parts/ui_productivity_state.inc
          grep -Fq '#include "ui_productivity_state.inc"' kernel/parts/ui_productivity.inc
          grep -Fq '#include "ui_productivity_views.inc"' kernel/parts/ui_productivity.inc
          grep -Fq 'UI_SYSTEM_APPS_READY clock=yes calendar=yes notes=zenovfs notepad=zenovfs' kernel/parts/ui_productivity_runtime.inc
          grep -Fq 'SYSTEM_APPS_QEMU_OK apps=clock,calendar,notes,notepad persistence=reboot' ci-logs/qemu-system-apps.log
          test -s build/qemu-system-apps/clock.ppm
          test -s build/qemu-system-apps/calendar.ppm
          test -s build/qemu-system-apps/notes.ppm
          test -s build/qemu-system-apps/notepad.ppm
          test -s ci-logs/productivity-apps-test
          test -s ci-logs/productivity-apps-test.log
          echo 'SYSTEM_APPS_SOURCE_CONTRACT_OK rtc=bounded calendar=gregorian notes=guarded notepad=persistent'

      - name: Upload system-app evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: system-apps-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ci-logs/
            build/KERNEL.BIN
            build/kernel.map
            build/zenov-os.img
            build/zenov-data.img
            build/qemu-system-apps/
            kernel/parts/ui_productivity_model.inc
            kernel/parts/ui_productivity.inc
            kernel/parts/ui_productivity_state.inc
            kernel/parts/ui_productivity_views.inc
            kernel/parts/ui_productivity_runtime.inc
            tests/productivity_apps_test.cpp
            tests/qemu_system_apps.sh
