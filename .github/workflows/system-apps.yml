name: ZenovOS 0.1.1 System Apps

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  system-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZENOV_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ZENOV_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tested source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZENOV_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ZENOV_SOURCE_REVISION"
          git cat-file -e "$ZENOV_SOURCE_REVISION^{commit}"
          test -z "$(git status --porcelain=v1)"

      - name: Install strict toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils clang openssl qemu-system-x86

      - name: Validate Markdown task model with GCC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/system-apps-model
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Wpedantic \
            tests/productivity_tasks_model.cpp -o build/system-apps-model/productivity-tasks-gcc
          build/system-apps-model/productivity-tasks-gcc | tee build/system-apps-model/productivity-tasks-gcc.log
          grep -Fqx 'PRODUCTIVITY_TASKS_MODEL_OK markdown=checkbox metadata=priority+due+waiting views=today+overdue+planned crud=guarded-edit+toggle+delete stale=fail-closed leap=yes' \
            build/system-apps-model/productivity-tasks-gcc.log

      - name: Validate Markdown task model with Clang sanitizers
        shell: bash
        run: |
          set -euo pipefail
          sanitizer=(-std=c++17 -O1 -g -Wall -Wextra -Werror -Wpedantic
            -fsanitize=address,undefined,unsigned-integer-overflow,implicit-unsigned-integer-truncation,implicit-signed-integer-truncation,implicit-integer-sign-change
            -fno-sanitize-recover=all -fno-omit-frame-pointer)
          clang++ "${sanitizer[@]}" tests/productivity_tasks_model.cpp \
            -o build/system-apps-model/productivity-tasks-clang
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            build/system-apps-model/productivity-tasks-clang | tee build/system-apps-model/productivity-tasks-clang.log
          grep -Fqx 'PRODUCTIVITY_TASKS_MODEL_OK markdown=checkbox metadata=priority+due+waiting views=today+overdue+planned crud=guarded-edit+toggle+delete stale=fail-closed leap=yes' \
            build/system-apps-model/productivity-tasks-clang.log

      - name: Build strict native image
        run: make clean check

      - name: Compile runtime-image verifier
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -Wpedantic \
            tools/zenovfs_productivity_verify.cpp -o build/zenovfs-productivity-verify

      - name: Verify system-app source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'constexpr uint32_t productivity_task_capacity = 24U;' kernel/parts/ui_productivity_tasks_types.inc
          grep -Fq 'uint32_t productivity_task_line_hash' kernel/parts/ui_productivity_tasks_types.inc
          grep -Fq 'ProductivityTaskFilter::today' kernel/parts/ui_productivity_tasks_index.inc
          grep -Fq 'ProductivityTaskFilter::overdue' kernel/parts/ui_productivity_tasks_index.inc
          grep -Fq 'ProductivityTaskFilter::planned' kernel/parts/ui_productivity_tasks_index.inc
          grep -Fq 'productivity_task_tag_boundary(data[marker + 5U])' kernel/parts/ui_productivity_tasks_index.inc
          grep -Fq 'storage::security_read_file' kernel/parts/ui_productivity_tasks_index.inc
          grep -Fq 'storage::security_read_file' kernel/parts/ui_productivity_tasks_storage.inc
          grep -Fq 'const int32_t existing_index = storage::find_entry(path);' kernel/parts/ui_productivity_tasks_storage.inc
          grep -Fq 'storage::zfs_entries[existing_index].type != storage::zfs_type_file' kernel/parts/ui_productivity_tasks_storage.inc
          ! grep -Fq 'productivity_tasks_source_exists' kernel/parts/ui_productivity_tasks*.inc
          grep -Fq 'storage::guarded_write_file' kernel/parts/ui_productivity_tasks_storage.inc
          grep -Fq 'productivity_tasks_edit_selected' kernel/parts/ui_productivity_tasks_storage.inc
          grep -Fq 'productivity_tasks_delete_selected' kernel/parts/ui_productivity_tasks_storage.inc
          grep -Fq 'UI_TASKS_STALE_REJECTED' kernel/parts/ui_productivity_tasks_storage.inc
          grep -Fq '!productivity_task_tag_boundary(data[state + 2U])' kernel/parts/ui_productivity_tasks_storage.inc
          grep -Fq 'productivity_launcher_query_is("tasks")' kernel/parts/ui_productivity_tasks_runtime.inc
          grep -Fq 'UI_PRODUCTIVITY_TASKS_READY markdown=yes metadata=priority+due+waiting views=today+overdue+planned crud=add+edit+toggle+delete' kernel/parts/ui_productivity_tasks_runtime.inc
          echo 'SYSTEM_APPS_SOURCE_CONTRACT_OK tasks=bounded views=smart mutations=hash-revalidated separators=canonical reads=guarded writes=guarded launcher=indexed'

      - name: Exercise Notes, Tasks, Calendar and Clock
        run: bash tests/qemu_productivity_ui.sh build/zenov-os.img build/zenov-data.img build/qemu-productivity-ui

      - name: Verify persistent application state
        shell: bash
        run: |
          set -euo pipefail
          build/zenovfs-verify build/qemu-productivity-ui/zenov-data-productivity.img | tee build/qemu-productivity-ui/zenovfs-verify.log
          build/zenovfs-productivity-verify build/qemu-productivity-ui/zenov-data-productivity.img | tee build/qemu-productivity-ui/productivity-verify.log
          grep -Fq 'ZENOV_PRODUCTIVITY_RUNTIME_IMAGE_OK notes=markdown+scratch+daily tasks=smart-views+guarded-crud calendar=events checksum=valid geometry=bounded' build/qemu-productivity-ui/productivity-verify.log
          grep -Fq 'UI_PRODUCTIVITY_APPS_READY notes=yes calendar=yes clock=yes scratchpad=yes' build/qemu-productivity-ui/serial.log
          grep -Fq 'UI_PRODUCTIVITY_TASKS_READY markdown=yes metadata=priority+due+waiting views=today+overdue+planned crud=add+edit+toggle+delete' build/qemu-productivity-ui/serial.log
          grep -Fq 'UI_TASKS_FILTER_OK' build/qemu-productivity-ui/serial.log
          grep -Fq 'UI_TASKS_ADD_OK' build/qemu-productivity-ui/serial.log
          grep -Fq 'UI_TASKS_EDIT_OK' build/qemu-productivity-ui/serial.log
          grep -Fq 'UI_TASKS_TOGGLE_OK' build/qemu-productivity-ui/serial.log
          grep -Fq 'UI_TASKS_DELETE_OK' build/qemu-productivity-ui/serial.log
          ! grep -Fq 'UI_TASKS_STALE_REJECTED' build/qemu-productivity-ui/serial.log
          grep -Fq 'UI_CLOCK_TIMER_RUNNING' build/qemu-productivity-ui/serial.log
          test -s build/qemu-productivity-ui/notes-editor.ppm
          test -s build/qemu-productivity-ui/tasks-planned.ppm
          test -s build/qemu-productivity-ui/tasks-edited.ppm
          test -s build/qemu-productivity-ui/tasks-done.ppm
          test -s build/qemu-productivity-ui/tasks-delete-persisted.ppm
          test -s build/qemu-productivity-ui/calendar-event.ppm
          test -s build/qemu-productivity-ui/clock-running.ppm
          test ! -s build/qemu-productivity-ui/qemu.stderr

      - name: Verify deterministic rebuild
        run: make deterministic

      - name: Upload system-app evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-0.1.1-system-apps-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            build/zenov-os.img
            build/zenov-data.img
            build/KERNEL.BIN
            build/zenovfs-productivity-verify
            build/system-apps-model/*
            build/qemu-productivity-ui/*.img
            build/qemu-productivity-ui/*.log
            build/qemu-productivity-ui/*.stderr
            build/qemu-productivity-ui/*.ppm
            kernel/parts/graphics.inc
            kernel/parts/ui_productivity.inc
            kernel/parts/ui_productivity_tasks*.inc
            tests/productivity_tasks_model.cpp
            tests/qemu_productivity_ui.sh
            tools/zenovfs_productivity_verify.cpp
