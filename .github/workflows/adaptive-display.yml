name: ZenovOS 0.1.1 Adaptive Display

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adaptive-display:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZENOV_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ZENOV_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tested source revision
        run: |
          set -euo pipefail
          [[ "$ZENOV_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$ZENOV_SOURCE_REVISION"
          git cat-file -e "$actual_revision^{commit}"
          test -z "$(git status --porcelain)"
          echo "tested-source-revision=$actual_revision"

      - name: Install native toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils openssl qemu-system-x86

      - name: Build strict native image
        run: make clean check

      - name: Exercise 32 VBE modes through verified FHD, 2K and 4K
        run: bash tests/qemu_display_ui.sh build/zenov-os.img build/zenov-data.img build/qemu-display-ui

      - name: Inspect adaptive display evidence
        run: |
          set -euo pipefail
          SERIAL=build/qemu-display-ui/serial.log
          for marker in \
            UI_ADAPTIVE_DISPLAY_OK UI_HYBRID_SCALER_OK UI_WIDESCREEN_CANVAS_OK \
            'UI_DISPLAY_MODE_COUNT 32' UI_DISPLAY_2K_CATALOG_OK UI_DISPLAY_4K_CATALOG_OK \
            UI_DISPLAY_2K_READY UI_DISPLAY_4K_READY \
            'FRAMEBUFFER_VRAM_BYTES 67108864' 'FRAMEBUFFER_MAPPING_BYTES 67108864' \
            FRAMEBUFFER_MAPPING_LARGE_PAGES UI_SETTINGS_CONTROLS_OK UI_ACCESSIBILITY_OK UI_MINIMAL_SHELL_OK \
            UI_FONT_WEIGHT_OK UI_ICON_SYSTEM_OK 'UI_FONT_GLYPH_COUNT 95' 'UI_ICON_COUNT 13' \
            UI_REDUCED_MOTION_ON 'UI_TRANSITION_FRAMES 4' 'UI_TRANSITION_FRAMES 1' \
            UI_START_PACKAGES_OPEN_OK UI_START_SECURITY_OPEN_OK \
            UI_DISPLAY_CYCLE_OK UI_DISPLAY_PERSIST_OK; do
            grep -q "$marker" "$SERIAL"
          done
          test ! -s build/qemu-display-ui/qemu.stderr
          test -s build/qemu-display-ui/framebuffer-sha256.txt
          test -s build/qemu-display-ui/display-mode-bytes.txt
          test -s build/qemu-display-ui/chrome-density-evidence.txt
          grep -q '^ratio=' build/qemu-display-ui/chrome-density-evidence.txt
          grep -q '^matrix-minimum text=' build/qemu-display-ui/theme-contrast-matrix.txt
          for mode in \
            640x480 720x480 800x600 960x540 960x600 1024x576 1024x600 1024x768 \
            1152x648 1152x720 1152x864 1280x720 1280x768 1280x800 1280x960 1280x1024 \
            1360x768 1368x768 1440x900 1536x864 1600x900 1600x1200 \
            1920x1080 1920x1200 2048x1080 2048x1152 2048x1536 \
            2560x1080 2560x1440 2560x1600 3840x2160 4096x2160; do
            grep -q "UI_DISPLAY_MODE_OK $mode" "$SERIAL"
          done
          for dimensions in \
            1920x1080 2048x1080 2560x1440 3840x2160 4096x2160; do
            frame="build/qemu-display-ui/desktop-${dimensions}.ppm"
            test -s "$frame"
            expected="${dimensions/x/ }"
            test "$(sed -n '2p' "$frame" | tr -d '\r')" = "$expected"
          done

      - name: Upload adaptive display evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-0.1.1-adaptive-display-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build/zenov-os.img
            build/zenov-data.img
            build/qemu-display-ui/*.log
            build/qemu-display-ui/*.stderr
            build/qemu-display-ui/*.ppm
            build/qemu-display-ui/*.txt
