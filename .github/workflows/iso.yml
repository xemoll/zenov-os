name: ZenovOS Self-Contained Live ISO

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/iso.yml'
      - '.github/workflows/publish-live1.yml'
      - 'Makefile'
      - 'GNUmakefile'
      - 'fs_surface.mk'
      - 'iso.mk'
      - 'run-zenovos.sh'
      - 'boot/**'
      - 'kernel/**'
      - 'user/**'
      - 'packaging/ISO-README.txt'
      - 'tools/build_iso.sh'
      - 'tools/live_image_pack.cpp'
      - 'tests/qemu_iso_smoke.sh'
      - 'tests/qemu_iso_persistence.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenov-os-live-iso-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot-live-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZENOV_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_DATE_EPOCH: 1784160000
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ZENOV_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and ISO-only contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZENOV_SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          bash -n tools/build_iso.sh
          bash -n tests/qemu_iso_smoke.sh
          bash -n tests/qemu_iso_persistence.sh
          bash -n run-zenovos.sh
          grep -Fq ZLIVE003 tools/live_image_pack.cpp
          grep -Fq 'format=ZLIVE003' kernel/parts/storage_live_image.inc
          grep -Fq 'ZENOVFS_LIVE_READY' kernel/parts/storage_ata_deadline_init.inc
          grep -Fq 'live_image_initialize' kernel/parts/storage_live_image.inc
          grep -Fq 'generated/live_zenovfs.hpp' kernel/parts/storage.inc
          grep -Fq 'ZENPKG_DATA_STAMP' iso.mk
          grep -Fq 'external-disks=0' tests/qemu_iso_persistence.sh
          grep -Fq 'SELECTED_ACCEL=tcg' run-zenovos.sh
          grep -Fq 'kernel_static_start = live_storage_end' kernel/parts/supervisor_layout.inc
          grep -Fq 'ASSERT(__kernel_static_end <= 0x00400000' kernel/linker.ld
          ! grep -Fq 'vm-appliances' iso.mk

      - name: Install native toolchain, QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            qemu-system-x86 \
            xorriso

      - name: Build and verify the self-contained ISO
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make all iso-check
          test -s build/ZenovOS-0.1.1-x86.iso
          test -s build/generated/live_zenovfs.hpp
          test "$(stat -c%s build/KERNEL.BIN)" -le 524288
          grep -Fq 'live_image_pack_bytes =' build/generated/live_zenovfs.hpp
          grep -Fq 'live_image_compressed_bytes =' build/generated/live_zenovfs.hpp
          raw="$(awk '/live_image_pack_bytes =/ {value=$5; gsub(/[^0-9]/, "", value); print value}' build/generated/live_zenovfs.hpp)"
          compressed="$(awk '/live_image_compressed_bytes =/ {value=$5; gsub(/[^0-9]/, "", value); print value}' build/generated/live_zenovfs.hpp)"
          [[ "$raw" =~ ^[0-9]+$ && "$compressed" =~ ^[0-9]+$ ]]
          test "$raw" -gt "$compressed"
          printf 'ZLIVE003_COMPRESSION_OK raw=%s compressed=%s\n' \
            "$raw" "$compressed" | tee build/live-compression.txt

          kernel_low_end="$(awk '/__kernel_low_end = \./ {print $1}' build/kernel.map | tail -1)"
          kernel_static_start="$(awk '/__kernel_static_start = \./ {print $1}' build/kernel.map | tail -1)"
          kernel_static_end="$(awk '/__kernel_static_end = \./ {print $1}' build/kernel.map | tail -1)"
          [[ "$kernel_low_end" =~ ^0x[0-9a-fA-F]+$ ]]
          [[ "$kernel_static_start" =~ ^0x[0-9a-fA-F]+$ ]]
          [[ "$kernel_static_end" =~ ^0x[0-9a-fA-F]+$ ]]
          low_headroom=$((0xA0000 - kernel_low_end))
          static_headroom=$((0x400000 - kernel_static_end))
          test "$kernel_static_start" = '0x00000000003b6000' -o \
               "$kernel_static_start" = '0x003b6000' -o \
               "$kernel_static_start" = '0x3b6000'
          test "$low_headroom" -ge 65536
          test "$static_headroom" -ge 1024
          printf 'KERNEL_LAYOUT_OK low_end=%s low_headroom=%s static_start=%s static_end=%s static_headroom=%s\n' \
            "$kernel_low_end" "$low_headroom" "$kernel_static_start" "$kernel_static_end" "$static_headroom" \
            | tee build/live-low-memory.txt

          QEMU=qemu-system-i386 bash run-zenovos.sh \
            --iso build/ZenovOS-0.1.1-x86.iso \
            --memory 128 \
            --accel tcg \
            --serial-log build/qemu/launcher-serial.log \
            --dry-run | tee build/qemu-launcher.txt
          grep -Fq 'accel=tcg' build/qemu-launcher.txt
          grep -Fq -- ' -boot ' build/qemu-launcher.txt
          grep -Fq 'order=d' build/qemu-launcher.txt
          grep -Fq 'strict=on' build/qemu-launcher.txt
          grep -Fq -- ' -drive ' build/qemu-launcher.txt
          grep -Fq 'file=' build/qemu-launcher.txt
          grep -Fq 'media=cdrom' build/qemu-launcher.txt
          grep -Fq 'readonly=on' build/qemu-launcher.txt

          test ! -e dist-vm
          sha256sum build/ZenovOS-0.1.1-x86.iso | tee build/live-iso.sha256
          xorriso -indev build/ZenovOS-0.1.1-x86.iso -report_el_torito plain \
            2>&1 | tee build/live-el-torito.txt
          grep -Fq 'El Torito boot img' build/live-el-torito.txt
          grep -Fq '/BOOT/ZENOVOS.IMG' build/live-el-torito.txt

      - name: Verify no-disk boot and writable session evidence
        shell: bash
        run: |
          set -euo pipefail
          for log in build/qemu/iso/serial.log build/qemu/iso-live/serial.log; do
            grep -Fq ZENOVOS_BOOT_OK "$log"
            grep -Fq 'ZENOVFS_LIVE_IMAGE_OK source=embedded format=ZLIVE003' "$log"
            grep -Fq 'ZENOVFS_LIVE_READY mode=ram-overlay persistence=session' "$log"
            grep -Fq 'ZENOVFS_STORAGE_MODE live-iso' "$log"
            grep -Fq ZENOVFS_MOUNT_OK "$log"
            grep -Fq GRAPHICAL_DESKTOP_READY "$log"
            grep -Fq ZENOVOS_UI_READY "$log"
          done
          grep -Fq WRITE_OK build/qemu/iso-live/serial.log
          grep -Fq ISO_LIVE_SESSION_OK build/qemu/iso-live/serial.log
          grep -Fq ZENOVFS_FSCK_OK build/qemu/iso-live/serial.log
          grep -Fq SYNC_OK build/qemu/iso-live/serial.log

      - name: Upload Live ISO evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-live-iso-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/ZenovOS-0.1.1-x86.iso
            build/live-iso.sha256
            build/live-compression.txt
            build/live-low-memory.txt
            build/qemu-launcher.txt
            build/live-el-torito.txt
            build/generated/live_zenovfs.hpp
            build/qemu/iso/
            build/qemu/iso-live/
            build/KERNEL.BIN
            build/kernel.elf
            build/kernel.map
            build/build-manifest.json
