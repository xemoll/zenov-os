name: Verify ZenovOS VM3 public ISO

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-vm3-public.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenov-os-vm3-public-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: v0.1.1-vm3

jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install public-release verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq xorriso

      - name: Verify public release and unauthenticated ISO
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          out="$RUNNER_TEMP/vm3-public-verify"
          rm -rf "$out"
          mkdir -p "$out"

          env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --location \
            --retry 3 --retry-all-errors --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            "$api_url" -o "$out/release.json"

          jq -e '.tag_name == "v0.1.1-vm3" and .draft == false and .prerelease == false' \
            "$out/release.json" >/dev/null
          test "$(jq '.assets | length' "$out/release.json")" -eq 15

          expected_names="$(printf '%s\n' \
            BUILD-MANIFEST.json \
            SHA256SUMS.txt \
            SOURCE-REVISION.txt \
            VM-APPLIANCE-MANIFEST.json \
            VM-QUICKSTART.txt \
            ZenovOS-0.1.1-data.img \
            ZenovOS-0.1.1-data.qcow2 \
            ZenovOS-0.1.1-data.vdi \
            ZenovOS-0.1.1-data.vmdk \
            ZenovOS-0.1.1-x86.img \
            ZenovOS-0.1.1-x86.iso \
            ZenovOS-0.1.1.vmx \
            manage-vm.sh \
            prepare-vm.ps1 \
            prepare-vm.sh | sort)"
          actual_names="$(jq -r '.assets[].name' "$out/release.json" | sort)"
          test "$actual_names" = "$expected_names"

          asset_url() {
            jq -r --arg name "$1" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              "$out/release.json"
          }

          iso_url="$(asset_url ZenovOS-0.1.1-x86.iso)"
          sums_url="$(asset_url SHA256SUMS.txt)"
          source_url="$(asset_url SOURCE-REVISION.txt)"
          test -n "$iso_url"
          test -n "$sums_url"
          test -n "$source_url"

          env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --location \
            --retry 3 --retry-all-errors --silent --show-error \
            "$iso_url" -o "$out/ZenovOS-0.1.1-x86.iso"
          env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --location \
            --retry 3 --retry-all-errors --silent --show-error \
            "$sums_url" -o "$out/SHA256SUMS.txt"
          env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --location \
            --retry 3 --retry-all-errors --silent --show-error \
            "$source_url" -o "$out/SOURCE-REVISION.txt"

          source_revision="$(tr -d '\r\n' < "$out/SOURCE-REVISION.txt")"
          [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r '.target_commitish' "$out/release.json")" = "$source_revision"

          grep -E '^[0-9a-f]{64}  ZenovOS-0\.1\.1-x86\.iso$' \
            "$out/SHA256SUMS.txt" > "$out/ISO-SHA256.txt"
          (cd "$out" && sha256sum -c ISO-SHA256.txt)

          xorriso -indev "$out/ZenovOS-0.1.1-x86.iso" \
            -report_el_torito plain 2>&1 | tee "$out/el-torito.txt"
          grep -Fq 'El Torito boot img' "$out/el-torito.txt"

          iso_sha="$(awk '{print $1}' "$out/ISO-SHA256.txt")"
          printf 'PUBLIC_VM3_OK source=%s assets=15 iso=%s\n' \
            "$source_revision" "$iso_sha" | tee "$out/result.txt"
          printf 'EVIDENCE_DIR=%s\n' "$out" >> "$GITHUB_ENV"

      - name: Upload public-release verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-vm3-public-release-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.EVIDENCE_DIR }}/release.json
            ${{ env.EVIDENCE_DIR }}/SOURCE-REVISION.txt
            ${{ env.EVIDENCE_DIR }}/ISO-SHA256.txt
            ${{ env.EVIDENCE_DIR }}/el-torito.txt
            ${{ env.EVIDENCE_DIR }}/result.txt
