name: Integrate on-access read protection on current main

on:
  push:
    branches:
      - agent/on-access-read-current-main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_BASE: a38379b493ddeb0916047cc70c3183cb404f1872
      SOURCE_HEAD: 199f98d478a7515c927c97d8fd61bdf5679e7e99
      TARGET_BASE: 5eac0bee73a46e7b132f0694322bf7c4531bd63b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install strict toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils clang openssl jq qemu-system-x86

      - name: Apply reviewed on-access diff without legacy storage monolith
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          test "$(git merge-base HEAD origin/main)" = "${TARGET_BASE}"
          git cat-file -e "${SOURCE_BASE}^{commit}"
          git cat-file -e "${SOURCE_HEAD}^{commit}"

          source_paths=(
            .github/workflows/antimalware.yml
            Makefile
            README.md
            docs/ANTIMALWARE_0.1.1.md
            docs/AUDIT_JOURNAL_0.1.1.md
            docs/INDEX.md
            docs/ON_ACCESS_PROTECTION_0.1.1.md
            docs/SECURITY_MODEL_0.1.1.md
            kernel/kernel.cpp
            kernel/parts/process.inc
            kernel/parts/security_audit.inc
            kernel/parts/security_guard.inc
            kernel/parts/security_io.inc
            tests/qemu_smoke.sh
            tools/check_antimalware.sh
            tools/zenov_audit_format.hpp
            tools/zenovfs_antimalware_verify.cpp
          )
          expected_paths=("${source_paths[@]}" kernel/parts/storage_zenovfs_commands.inc)
          printf '%s\n' "${expected_paths[@]}" | sort > /tmp/expected-paths
          git diff --binary "${SOURCE_BASE}" "${SOURCE_HEAD}" -- "${source_paths[@]}" > /tmp/on-access-current-main.patch
          test -s /tmp/on-access-current-main.patch

          if ! git apply --3way --index /tmp/on-access-current-main.patch 2>&1 | tee ci-logs/git-apply.log; then
            git status --short > ci-logs/apply-status.log
            git diff --name-only --diff-filter=U > ci-logs/conflicts.log
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('kernel/parts/storage_zenovfs_commands.inc')
          text = path.read_text()
          raw_cat = "void cat(const char* input) { uint32_t size = 0; if (!read_file(input, file_buffer, max_file_bytes(), size)) { console::warning(\"File not found or checksum failed.\"); return; } for (uint32_t i = 0; i < size; ++i) console::put(static_cast<char>(file_buffer[i])); if (!size || file_buffer[size - 1] != '\\n') console::put('\\n'); }\n"
          assert text.count(raw_cat) == 1, text.count(raw_cat)
          path.write_text(text.replace(raw_cat, '', 1))
          PY
          git add kernel/parts/storage_zenovfs_commands.inc

          git diff --cached --name-only | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths | tee ci-logs/path-set.log
          ! grep -Fxq 'kernel/parts/storage.inc' /tmp/actual-paths
          grep -Fq 'void guarded_cat(const char* input)' kernel/parts/security_io.inc
          ! grep -Fq 'void cat(const char* input)' kernel/parts/storage_zenovfs_commands.inc
          git diff --cached --check | tee ci-logs/diff-check.log
          bash -n tests/qemu_smoke.sh
          bash -n tools/check_antimalware.sh

      - name: Run strict host and freestanding checks
        shell: bash
        run: |
          set -euo pipefail
          make clean check 2>&1 | tee ci-logs/make-check.log

      - name: Run complete QEMU security lifecycle
        shell: bash
        run: |
          set -euo pipefail
          make qemu 2>&1 | tee ci-logs/qemu.log
          grep -Fq 'ZENOV_GUARD_READ_AUDIT path=/samples/pua-test.bin' build/qemu/serial-phase1.log
          grep -Fq 'ZENOV_GUARD_READ_BLOCKED path=/samples/ransomware-test.bin' build/qemu/serial-phase1.log
          grep -Fq 'ZENOV_GUARD_READ_BLOCKED path=/samples/malware-v2.bin' build/qemu/serial-phase1.log
          test "$(grep -Foc 'ZENOV_PUA_TEST_V1' build/qemu/serial-phase1.log)" -eq 2
          test "$(grep -Foc 'ZENOV_RANSOMWARE_TEST_V1' build/qemu/serial-phase1.log)" -eq 1
          test "$(grep -Foc 'ZENOV_MALWARE_TEST_V2' build/qemu/serial-phase1.log || true)" -eq 0
          grep -Fq 'ZENOV_SECURITY_RUNTIME_IMAGE_OK' ci-logs/qemu.log

      - name: Prove deterministic rebuild
        shell: bash
        run: |
          set -euo pipefail
          make deterministic 2>&1 | tee ci-logs/deterministic.log
          grep -Fq 'deterministic rebuild: OK' ci-logs/deterministic.log

      - name: Record verified tree
        shell: bash
        run: |
          set -euo pipefail
          git write-tree | tee ci-logs/verified-tree.log
          git diff --cached --stat | tee ci-logs/verified-diff-stat.log
          git status --short | tee ci-logs/final-status.log

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: on-access-current-main-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            /tmp/on-access-current-main.patch
            /tmp/expected-paths
            /tmp/actual-paths
            ci-logs/
            build/qemu/serial*.log
            build/qemu/*.stderr
            build/build-manifest.json
