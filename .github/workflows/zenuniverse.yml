name: ZenUniverse Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'GNUmakefile'
      - 'universe.mk'
      - 'tools/zenuniverse/**'
      - 'tests/zenuniverse_test.sh'
      - 'tests/zenuniverse_runtime_provider_test.sh'
      - 'packages/universe/**'
      - 'docs/ZENUNIVERSE_REPOSITORY_0.1.1.md'
      - 'docs/RUNTIME_PROVIDER_ABI_0.1.1.md'
      - 'docs/INDEX.md'
      - '.github/workflows/zenuniverse.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'GNUmakefile'
      - 'universe.mk'
      - 'tools/zenuniverse/**'
      - 'tests/zenuniverse_test.sh'
      - 'tests/zenuniverse_runtime_provider_test.sh'
      - 'packages/universe/**'
      - 'docs/ZENUNIVERSE_REPOSITORY_0.1.1.md'
      - 'docs/RUNTIME_PROVIDER_ABI_0.1.1.md'
      - 'docs/INDEX.md'
      - '.github/workflows/zenuniverse.yml'
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CXX: g++
  SOURCE_DATE_EPOCH: '0'
  ZENOV_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  universal-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ZENOV_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact tested source revision
        run: |
          set -euo pipefail
          [[ "$ZENOV_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$ZENOV_SOURCE_REVISION"
          git cat-file -e "$actual_revision^{commit}"
          test -z "$(git status --porcelain)"
          echo "tested-source-revision=$actual_revision"
      - name: Install strict native toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential clang
      - name: Build and test provider, artifact and launch contracts
        run: make universe-check
      - name: Verify deterministic catalog independently
        run: |
          set -euo pipefail
          rm -rf /tmp/zenuniverse-rebuild
          make --no-print-directory BUILD=/tmp/zenuniverse-rebuild universe-check
          cmp build/zenuniverse.zuc /tmp/zenuniverse-rebuild/zenuniverse.zuc
          grep -q '^ZENUNIVERSE1$' build/zenuniverse.zuc
          grep -q '^count=22$' build/zenuniverse.zuc
          grep -q '^provider-abi=zen-runtime-provider-1$' build/zenuniverse.zuc
          grep -q '^requires-any=graphics.opengl3.1|graphics.vulkan1.0$' build/zenuniverse.zuc
          ! grep -q -- '-or-vulkan' build/zenuniverse.zuc
      - name: Verify provider policy inventory
        run: |
          set -euo pipefail
          test "$(find packages/universe -name '*.zsource' | wc -l)" -eq 22
          runtime_count="$(grep -Rl '^kind=runtime$' packages/universe --include='*.zsource' | wc -l)"
          test "$runtime_count" -eq 11
          test "$(grep -Rl '^provider-abi=zen-runtime-provider-1$' packages/universe/runtime-*.zsource | wc -l)" -eq 11
          test "$(grep -Rl '^launch-mode=' packages/universe/runtime-*.zsource | wc -l)" -eq 11
          grep -q '^delivery=builtin$' packages/universe/runtime-native.zsource
          grep -q '^availability=available$' packages/universe/runtime-native.zsource
          grep -q '^entrypoint=@kernel-loader$' packages/universe/runtime-native.zsource
          grep -q '^asset=firmware.playstation1-bios$' packages/universe/runtime-duckstation.zsource
          grep -q '^asset=firmware.playstation2-bios$' packages/universe/runtime-pcsx2.zsource
          grep -q '^arg=-batch$' packages/universe/runtime-duckstation.zsource
          grep -q '^arg=--$' packages/universe/runtime-duckstation.zsource
          grep -q '^arg=%artifact%$' packages/universe/runtime-duckstation.zsource
          ! grep -R '^mirror=' packages/universe/profile-*game.zsource
          ! grep -R -E 'BEGIN (RSA )?PRIVATE KEY|BEGIN PRIVATE KEY' tools/zenuniverse packages/universe
      - name: Verify retained executable evidence
        run: |
          set -euo pipefail
          provider_dir=build/zenuniverse-runtime-test
          general_dir=build/zenuniverse-test
          test -x "$provider_dir/zenuniverse"
          test -x "$provider_dir/zenuniverse-sanitized"
          grep -q '^ZENUNIVERSE_LAUNCH_READY profile=org.zenov.profile.native-app reasons=0$' "$provider_dir/native-launch.log"
          grep -q '^ZENUNIVERSE_LAUNCH_BLOCKED profile=org.zenov.profile.playstation1-game reasons=13$' "$provider_dir/ps1-launch-missing.log"
          grep -q '^asset=firmware.playstation1-bios bytes=960 sha256=' "$provider_dir/ps1-launch-bios.log"
          grep -q 'no satisfiable capability alternative: graphics.opengl3.1|graphics.vulkan1.0' "$provider_dir/ps1.log"
          grep -q 'ZENUNIVERSE_RESOLVE_OK' "$general_dir/resolved.log"
          test -s "$provider_dir/fixtures/hello.zartifact"
          test -s "$provider_dir/fixtures/hello.zlaunch"
          cmp "$provider_dir/native-launch.log" "$provider_dir/fixtures/hello.zlaunch"
          sha256sum "$provider_dir/fixtures/hello.zex" "$provider_dir/fixtures/game.chd" "$provider_dir/fixtures/ps1-bios.bin" > build/runtime-fixture-sha256.txt
          echo 'ZENUNIVERSE_PROVIDER_GATE_OK schema=v1 catalog=22 native=ready foreign=fail-closed artifact=content-addressed assets=hashed alternatives=typed sanitizers=yes'
      - name: Upload provider ABI v1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: zenuniverse-runtime-provider-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            build/zenuniverse
            build/zenuniverse.zuc
            build/zenuniverse-test/
            build/zenuniverse-runtime-test/
            build/runtime-fixture-sha256.txt
            tools/zenuniverse/
            tests/zenuniverse_test.sh
            tests/zenuniverse_runtime_provider_test.sh
            packages/universe/runtime-*.zsource
            packages/universe/profile-native-app.zsource
            packages/universe/profile-playstation1-game.zsource
            packages/universe/profile-psp-game.zsource
            docs/RUNTIME_PROVIDER_ABI_0.1.1.md
