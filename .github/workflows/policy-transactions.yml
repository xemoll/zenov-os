name: ZenovOS Signed Policy Transactions

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rollback-safe-policy-updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ZENOV_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ZENOV_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact tested source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZENOV_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ZENOV_SOURCE_REVISION"
          git cat-file -e "$ZENOV_SOURCE_REVISION^{commit}"
          test -z "$(git status --porcelain=v1)"

      - name: Install strict toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils clang openssl qemu-system-x86 zip unzip

      - name: Run rollback transaction model under GCC and Clang sanitizers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          common=(-std=c++17 -O2 -Wall -Wextra -Werror -Wpedantic)
          g++ "${common[@]}" tests/security_policy_transaction_test.cpp -o ci-logs/security-policy-transaction-test-gcc
          ci-logs/security-policy-transaction-test-gcc | tee ci-logs/security-policy-transaction-gcc.log

          sanitizer=(-std=c++17 -O1 -g -Wall -Wextra -Werror -Wpedantic
            -fsanitize=address,undefined,unsigned-integer-overflow,implicit-unsigned-integer-truncation,implicit-signed-integer-truncation,implicit-integer-sign-change
            -fno-sanitize-recover=all -fno-omit-frame-pointer)
          clang++ "${sanitizer[@]}" tests/security_policy_transaction_test.cpp -o ci-logs/security-policy-transaction-test-clang
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ci-logs/security-policy-transaction-test-clang | tee ci-logs/security-policy-transaction-clang.log

          marker='SECURITY_POLICY_TRANSACTION_TEST_OK format=4 backup=bounded nested=blocked readback=verified version=verified wipe=volatile'
          grep -Fqx "$marker" ci-logs/security-policy-transaction-gcc.log
          grep -Fqx "$marker" ci-logs/security-policy-transaction-clang.log
          test -s ci-logs/security-policy-transaction-test-gcc
          test -s ci-logs/security-policy-transaction-test-clang

      - name: Run strict host and freestanding checks
        run: make clean check

      - name: Exercise all signed policy updates in QEMU
        run: make qemu

      - name: Verify runtime commit and reboot persistence
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ZGDB_ATOMIC_UPDATE_OK version=4' build/qemu/serial-phase1.log
          grep -Fq 'ZCAP_ATOMIC_UPDATE_OK version=2' build/qemu/serial-phase1.log
          grep -Fq 'ZMID_ATOMIC_UPDATE_OK version=2' build/qemu/serial-phase1.log
          grep -Fq 'ZGDB_POLICY_VERSION_OK version=4' build/qemu/serial-phase2.log
          grep -Fq 'ZCAP_POLICY_VERSION_OK version=2' build/qemu/serial-phase2.log
          grep -Fq 'ZMID_DATABASE_VERSION_OK version=2' build/qemu/serial-phase2.log
          ! grep -Fq 'UPDATE_ROLLBACK_FAILED' build/qemu/serial-phase1.log
          ! grep -Fq 'UPDATE_READBACK_FAILED' build/qemu/serial-phase1.log
          ! grep -Fq 'UPDATE_VERSION_READBACK_FAILED' build/qemu/serial-phase1.log
          ! grep -Fq 'UPDATE_SYNC_FAILED' build/qemu/serial-phase1.log

      - name: Verify deterministic rebuild
        run: make deterministic

      - name: Verify transaction source contract and retained evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '#include "parts/security_policy_transaction.inc"' kernel/kernel.cpp
          grep -Fq 'constexpr uintptr_t policy_transaction = 0x00312000U;' kernel/parts/supervisor_layout.inc
          grep -Fq 'constexpr uint32_t policy_transaction_bytes = 0x00004000U;' kernel/parts/supervisor_layout.inc
          grep -Fq 'volatile uint8_t* output = rollback_data;' kernel/parts/security_policy_transaction.inc
          grep -Fq 'bool restore_verified' kernel/parts/security_policy_transaction.inc
          grep -Fq 'bool version_matches' kernel/parts/security_policy_transaction.inc
          grep -Fq 'security_policy_transaction::acquire("/security/zenovguard.zgdb"' kernel/parts/zgdb_policy.inc
          grep -Fq 'security_policy_transaction::acquire("/security/syscall-capabilities.zcap"' kernel/parts/zcap_policy.inc
          grep -Fq 'security_policy_transaction::acquire("/security/zenovguard-intelligence.zmid"' kernel/parts/zmid_policy.inc
          grep -Fq 'ZGDB_UPDATE_VERSION_READBACK_FAILED' kernel/parts/zgdb_policy.inc
          grep -Fq 'ZCAP_UPDATE_VERSION_READBACK_FAILED' kernel/parts/zcap_policy.inc
          grep -Fq 'ZMID_UPDATE_VERSION_READBACK_FAILED' kernel/parts/zmid_policy.inc
          grep -Fq 'format_nonzero_decimal_u32' kernel/parts/security_policy_format.inc
          grep -Fq 'SECURITY_POLICY_TRANSACTION_TEST_OK' ci-logs/security-policy-transaction-clang.log
          test -s ci-logs/security-policy-transaction-test-gcc
          test -s ci-logs/security-policy-transaction-test-clang
          echo 'SIGNED_POLICY_TRANSACTION_SOURCE_CONTRACT_OK domains=3 rollback=verified version-readback=yes sync=yes supervisor-only=yes'

      - name: Upload signed policy transaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-policy-transactions-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ci-logs/security-policy-transaction-test-gcc
            ci-logs/security-policy-transaction-test-clang
            ci-logs/security-policy-transaction-gcc.log
            ci-logs/security-policy-transaction-clang.log
            build/KERNEL.BIN
            build/kernel.map
            build/zenov-os.img
            build/zenov-data.img
            build/build-manifest.json
            build/qemu/serial-phase1.log
            build/qemu/serial-phase2.log
            build/qemu/zenov-data-runtime.img
            kernel/kernel.cpp
            kernel/parts/security_policy_format.inc
            kernel/parts/security_policy_transaction.inc
            kernel/parts/supervisor_layout.inc
            kernel/parts/zgdb_policy.inc
            kernel/parts/zcap_policy.inc
            kernel/parts/zmid_policy.inc
            tests/security_policy_transaction_test.cpp
            docs/SIGNED_POLICY_TRANSACTIONS_0.1.1.md
