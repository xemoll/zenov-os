name: Verify policy-state hardening v2

on:
  pull_request:

concurrency:
  group: policy-state-hardening-verify-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-publish-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct exact production tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/agent/apply_policy_state_hardening.py /tmp/apply_policy_state_hardening.py
          cp .github/agent/security_policy_format.inc /tmp/security_policy_format.inc
          cp .github/agent/security_policy_format_test.cpp /tmp/security_policy_format_test.cpp
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_policy_state_hardening.py')
          text = path.read_text()
          start = text.index('        pattern = re.compile(\n', text.index('def harden_init'))
          end = text.index('        replacement = (\n', start)
          replacement = '''        pattern = re.compile(
              rf\'\'\'uint8_t\\s+version_buffer\\[16\\](?:\\{{\\}})?;?\\s*uint32_t\\s+version_size\\s*=\\s*0(?:U)?;\\s*\'\'\'
              rf\'\'\'{re.escape(variable)}\\s*=\\s*storage::read_file\\(\\s*\\"{re.escape(version_path)}\\"\\s*,\\s*\'\'\'
              rf\'\'\'version_buffer\\s*,\\s*sizeof\\(version_buffer\\)\\s*,\\s*version_size\\s*\\)\\s*\\?\\s*\'\'\'
              rf\'\'\'parse_version\\(\\s*version_buffer\\s*,\\s*version_size\\s*\\)\\s*:\\s*0(?:U)?;\'\'\',
              re.S,
          )
          '''
          text = text[:start] + replacement + text[end:]
          old = 'changed = {line.strip() for line in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines() if line.strip()}'
          new = old + '\nchanged.update(line.strip() for line in subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines() if line.strip())'
          if text.count(old) != 1:
              raise SystemExit('scope matcher replacement count != 1')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile /tmp/apply_policy_state_hardening.py
          git switch --detach dc29f826da1e6577a6215ba429d06c787ba59f1f
          test "$(git rev-parse HEAD)" = dc29f826da1e6577a6215ba429d06c787ba59f1f
          python3 /tmp/apply_policy_state_hardening.py | tee /tmp/policy-state-apply.log
          git diff --check

      - name: Install strict toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils clang jq openssl qemu-system-x86

      - name: Run focused Clang sanitizers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sanitized
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -Wpedantic \
            -fsanitize=address,undefined,unsigned-integer-overflow,implicit-conversion \
            -fno-sanitize-recover=all -fno-omit-frame-pointer \
            tests/security_policy_format_test.cpp -o build/sanitized/security-policy-format-test
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            build/sanitized/security-policy-format-test | tee build/security-policy-format-test.log
          grep -Fq 'SECURITY_POLICY_FORMAT_TEST_OK decimal=10 path=11 version-wrap=blocked' build/security-policy-format-test.log

      - name: Run strict build and storage matrices
        run: make clean check

      - name: Run ZVRT QEMU lifecycle
        run: make zvrt-qemu

      - name: Verify deterministic rebuild
        run: make deterministic

      - name: Derive content-addressed production tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            .github/workflows/zvrt.yml
            Makefile
            docs/VERIFIED_READS_0.1.1.md
            kernel/kernel.cpp
            kernel/parts/security_policy_format.inc
            kernel/parts/zgdb_policy.inc
            kernel/parts/zcap_policy.inc
            kernel/parts/zmid_policy.inc
            kernel/parts/zrwp_policy.inc
            kernel/parts/zvrt_policy.inc
            tests/security_policy_format_test.cpp
            tools/zrwp_verify.cpp
            tools/zvrt_verify.cpp
          )
          git add "${paths[@]}"
          local_tree=$(git write-tree)
          base_tree=$(git rev-parse HEAD^{tree})
          : > /tmp/policy-state-tree-map.txt
          printf 'parent=%s\nbase_tree=%s\nlocal_tree=%s\n' "$(git rev-parse HEAD)" "$base_tree" "$local_tree" >> /tmp/policy-state-tree-map.txt
          printf '{"base_tree":"%s","tree":[' "$base_tree" > /tmp/tree-request.json
          first=1
          for path in "${paths[@]}"; do
            expected=$(git hash-object "$path")
            mode=$(git ls-files -s -- "$path" | awk '{print $1}')
            encoded=$(base64 -w0 "$path")
            response=$(jq -cn --arg content "$encoded" '{content:$content,encoding:"base64"}' | curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs" --data-binary @-)
            actual=$(jq -r '.sha' <<<"$response")
            test "$actual" = "$expected"
            if [[ $first -eq 0 ]]; then printf ',' >> /tmp/tree-request.json; fi
            first=0
            jq -cn --arg path "$path" --arg mode "$mode" --arg sha "$actual" '{path:$path,mode:$mode,type:"blob",sha:$sha}' >> /tmp/tree-request.json
            printf '%s\t%s\t%s\n' "$path" "$mode" "$actual" >> /tmp/policy-state-tree-map.txt
          done
          printf ']}' >> /tmp/tree-request.json
          tree_response=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/trees" --data-binary @/tmp/tree-request.json)
          remote_tree=$(jq -r '.sha' <<<"$tree_response")
          test "$remote_tree" = "$local_tree"
          printf 'remote_tree=%s\n' "$remote_tree" >> /tmp/policy-state-tree-map.txt
          cat /tmp/policy-state-tree-map.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: policy-state-hardening-v2-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/policy-state-apply.log
            /tmp/policy-state-tree-map.txt
            build/security-policy-format-test.log
            build/KERNEL.BIN
            build/kernel.map
            build/qemu/zvrt/
            kernel/parts/security_policy_format.inc
            tests/security_policy_format_test.cpp
