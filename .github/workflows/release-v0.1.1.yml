name: Publish ZenovOS v0.1.1

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.1.1.yml'
      - 'boot/**'
      - 'kernel/**'
      - 'user/**'
      - 'packaging/**'
      - 'tools/package_release.sh'
      - 'tests/**'
      - 'Makefile'
      - 'GNUmakefile'
      - 'Zenov.toml'
      - 'README.md'
      - 'docs/ABI_0.1.1.md'
      - 'docs/releases/v0.1.1.md'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character commit SHA referenced by v0.1.1'
        required: true
        type: string
      sync_notes_only:
        description: 'Update only the GitHub Release title/body; never change tag or assets'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: zenov-os-v0.1.1-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.1

jobs:
  validate-package:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZENOV_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ZENOV_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source revision and release policy
        run: |
          set -euo pipefail
          [[ "$ZENOV_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$ZENOV_SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          grep -Fq 'workflow_dispatch:' .github/workflows/release-v0.1.1.yml
          grep -Fq 'sync_notes_only:' .github/workflows/release-v0.1.1.yml
          grep -Fq '22a3eec9b97b0ef0fac35be641c2526c577b1964' docs/releases/v0.1.1.md
          ! grep -Fq 'git push origin HEAD:main' .github/workflows/release-v0.1.1.yml
          ! grep -Fq 'gh release delete-asset' .github/workflows/release-v0.1.1.yml
          ! grep -Fq 'actions/checkout@v' .github/workflows/release-v0.1.1.yml
          ! grep -Fq 'actions/upload-artifact@v' .github/workflows/release-v0.1.1.yml
          echo "tested-source-revision=$actual_revision"

      - name: Install native toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils qemu-system-x86 zip unzip

      - name: Verify native 0.1.1 build
        run: make clean test

      - name: Build and verify deterministic installation package
        run: |
          set -euo pipefail
          bash tools/package_release.sh build/zenov-os.img build/zenov-data.img dist package
          grep -q ZENOVOS_BOOT_OK build/qemu/serial.log
          grep -q PMM_OK build/qemu/serial.log
          grep -q PAGING_OK build/qemu/serial.log
          grep -q ZENOVFS_MOUNT_OK build/qemu/serial.log
          grep -q PROCESS_ABI_0_1_1_OK build/qemu/serial.log
          grep -q APP_START_ZEX build/qemu/serial.log
          grep -q HELLO_ZEX_0_1_1_OK build/qemu/serial.log
          grep -q APP_START_ELF build/qemu/serial.log
          grep -q FILEIO_ELF_OK build/qemu/serial.log
          grep -q ZENOVFS_FSCK_OK build/qemu/serial.log
          test "$(grep -c 'APP_EXIT code=0' build/qemu/serial.log)" -ge 2
          test "$(grep -c PERSISTENCE_0_1_1_OK build/qemu/serial.log)" -ge 2
          test "$(grep -c FILE_SYSCALL_PERSIST_OK build/qemu/serial.log)" -ge 2
          for asset in \
            ZenovOS-0.1.1-x86.img \
            ZenovOS-0.1.1-x86.zip \
            BUILD-MANIFEST.json \
            SOURCE-REVISION.txt \
            INSTALL.txt \
            SHA256SUMS.txt; do
            test -s "dist/$asset"
          done
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload release-validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-v0.1.1-release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/
            build/KERNEL.BIN
            build/kernel.elf
            build/kernel.map
            build/zenov-data.img
            build/build-manifest.json
            build/qemu/serial.log
            build/qemu/serial-phase1.log
            build/qemu/serial-phase2.log
            build/qemu/screenshot.ppm

  sync-release-notes:
    if: github.event_name == 'workflow_dispatch' && inputs.sync_notes_only == true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZENOV_SOURCE_REVISION: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable tag and canonical notes
        run: |
          set -euo pipefail
          [[ "$ZENOV_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$ZENOV_SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          test -s docs/releases/v0.1.1.md
          grep -Fq "$ZENOV_SOURCE_REVISION" docs/releases/v0.1.1.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Synchronize GitHub Release title and body only
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'ZenovOS 0.1.1' \
            --notes-file docs/releases/v0.1.1.md \
            --latest
          expected="$(cat docs/releases/v0.1.1.md)"
          published="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body')"
          test "$published" = "$expected"

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.sync_notes_only != true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZENOV_SOURCE_REVISION: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ZENOV_SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify explicit source is an exact main commit
        run: |
          set -euo pipefail
          [[ "$ZENOV_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$ZENOV_SOURCE_REVISION"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$actual_revision" origin/main
          test -z "$(git status --porcelain)"
          echo "release-source-revision=$actual_revision"

      - name: Install native toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils qemu-system-x86 zip unzip

      - name: Verify native 0.1.1 build
        run: make clean test

      - name: Build deterministic installation package
        run: |
          set -euo pipefail
          bash tools/package_release.sh build/zenov-os.img build/zenov-data.img dist package
          grep -q ZENOVOS_BOOT_OK build/qemu/serial.log
          grep -q ZENOVFS_MOUNT_OK build/qemu/serial.log
          grep -q PROCESS_ABI_0_1_1_OK build/qemu/serial.log
          grep -q ZENOVFS_FSCK_OK build/qemu/serial.log
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Verify or create immutable release tag
        run: |
          set -euo pipefail
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n1 "$RELEASE_TAG")" = "$ZENOV_SOURCE_REVISION"
          else
            tag_object="$(gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$RELEASE_TAG" \
              -f message='ZenovOS 0.1.1' \
              -f object="$ZENOV_SOURCE_REVISION" \
              -f type='commit' \
              --jq '.sha')"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$tag_object" >/dev/null
          fi

      - name: Read canonical release notes from main
        run: |
          set -euo pipefail
          git show origin/main:docs/releases/v0.1.1.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          grep -Fq "$ZENOV_SOURCE_REVISION" /tmp/release-notes.md

      - name: Publish once or verify immutable assets
        run: |
          set -euo pipefail
          assets=(
            dist/ZenovOS-0.1.1-x86.img
            dist/ZenovOS-0.1.1-x86.zip
            dist/BUILD-MANIFEST.json
            dist/SOURCE-REVISION.txt
            dist/INSTALL.txt
            dist/SHA256SUMS.txt
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            test "$target" = "$ZENOV_SOURCE_REVISION"
            draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$draft" == true ]]; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title 'ZenovOS 0.1.1' \
                --notes-file /tmp/release-notes.md \
                --draft=false \
                --latest
            else
              rm -rf /tmp/published-assets
              mkdir -p /tmp/published-assets
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/published-assets
              for asset in "${assets[@]}"; do
                cmp "$asset" "/tmp/published-assets/$(basename "$asset")"
              done
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title 'ZenovOS 0.1.1' \
                --notes-file /tmp/release-notes.md \
                --latest
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$ZENOV_SOURCE_REVISION" \
              --title 'ZenovOS 0.1.1' \
              --notes-file /tmp/release-notes.md \
              --draft
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 6

      - name: Record publication evidence without modifying main
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          cat > build/release-evidence/v0.1.1.md <<STATUS
          # ZenovOS v0.1.1 publication status

          Status: **published and verified**

          Source commit: \`$ZENOV_SOURCE_REVISION\`
          Workflow run: \`$GITHUB_RUN_ID\`
          Release tag: \`$RELEASE_TAG\`
          Assets: \`6\`
          STATUS

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-v0.1.1-publication-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/
            build/release-evidence/
            build/KERNEL.BIN
            build/kernel.elf
            build/kernel.map
            build/zenov-data.img
            build/build-manifest.json
            build/qemu/serial.log
            build/qemu/serial-phase1.log
            build/qemu/serial-phase2.log
            build/qemu/screenshot.ppm
