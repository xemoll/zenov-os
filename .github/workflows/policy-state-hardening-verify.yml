name: Verify exact policy-state hardening tree

on:
  push:
    branches:
      - agent/policy-state-hardening-verify
  pull_request:

concurrency:
  group: policy-state-hardening-verify
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-publish-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct exact production tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/agent/apply_policy_state_hardening.py /tmp/apply_policy_state_hardening.py
          cp .github/agent/security_policy_format.inc /tmp/security_policy_format.inc
          cp .github/agent/security_policy_format_test.cpp /tmp/security_policy_format_test.cpp
          git switch --detach dc29f826da1e6577a6215ba429d06c787ba59f1f
          test "$(git rev-parse HEAD)" = dc29f826da1e6577a6215ba429d06c787ba59f1f
          python3 /tmp/apply_policy_state_hardening.py | tee /tmp/policy-state-apply.log
          git diff --check
          test -z "$(git status --porcelain=v1 | grep -E '^\?\? \.github/agent|^\?\? \.github/workflows/policy-state-hardening-verify.yml' || true)"

      - name: Install strict toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils clang jq openssl qemu-system-x86

      - name: Run focused Clang sanitizers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sanitized
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -Wpedantic \
            -fsanitize=address,undefined,unsigned-integer-overflow,implicit-integer-conversion \
            -fno-sanitize-recover=all -fno-omit-frame-pointer \
            tests/security_policy_format_test.cpp -o build/sanitized/security-policy-format-test
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            build/sanitized/security-policy-format-test | tee build/security-policy-format-test.log
          grep -Fq 'SECURITY_POLICY_FORMAT_TEST_OK decimal=10 path=11 version-wrap=blocked' build/security-policy-format-test.log

      - name: Run strict build and storage matrices
        run: make clean check

      - name: Run ZVRT QEMU lifecycle
        run: make zvrt-qemu

      - name: Verify deterministic rebuild
        run: make deterministic

      - name: Derive content-addressed production tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            .github/workflows/zvrt.yml
            Makefile
            docs/VERIFIED_READS_0.1.1.md
            kernel/kernel.cpp
            kernel/parts/security_policy_format.inc
            kernel/parts/zgdb_policy.inc
            kernel/parts/zcap_policy.inc
            kernel/parts/zmid_policy.inc
            kernel/parts/zrwp_policy.inc
            kernel/parts/zvrt_policy.inc
            tests/security_policy_format_test.cpp
            tools/zrwp_verify.cpp
            tools/zvrt_verify.cpp
          )
          git add "${paths[@]}"
          local_tree=$(git write-tree)
          base_tree=$(git rev-parse HEAD^{tree})
          : > /tmp/policy-state-tree-map.txt
          printf 'parent=%s\nbase_tree=%s\nlocal_tree=%s\n' "$(git rev-parse HEAD)" "$base_tree" "$local_tree" >> /tmp/policy-state-tree-map.txt
          printf '{"base_tree":"%s","tree":[' "$base_tree" > /tmp/tree-request.json
          first=1
          for path in "${paths[@]}"; do
            expected=$(git hash-object "$path")
            mode=$(git ls-files -s -- "$path" | awk '{print $1}')
            encoded=$(base64 -w0 "$path")
            response=$(jq -cn --arg content "$encoded" '{content:$content,encoding:"base64"}' | \
              curl --fail-with-body -sS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs" --data-binary @-)
            actual=$(jq -r '.sha' <<<"$response")
            test "$actual" = "$expected"
            if [[ $first -eq 0 ]]; then printf ',' >> /tmp/tree-request.json; fi
            first=0
            jq -cn --arg path "$path" --arg mode "$mode" --arg sha "$actual" \
              '{path:$path,mode:$mode,type:"blob",sha:$sha}' >> /tmp/tree-request.json
            printf '%s\t%s\t%s\n' "$path" "$mode" "$actual" >> /tmp/policy-state-tree-map.txt
          done
          printf ']}' >> /tmp/tree-request.json
          tree_response=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/trees" --data-binary @/tmp/tree-request.json)
          remote_tree=$(jq -r '.sha' <<<"$tree_response")
          test "$remote_tree" = "$local_tree"
          printf 'remote_tree=%s\n' "$remote_tree" >> /tmp/policy-state-tree-map.txt
          cat /tmp/policy-state-tree-map.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: policy-state-hardening-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/policy-state-apply.log
            /tmp/policy-state-tree-map.txt
            build/security-policy-format-test.log
            build/KERNEL.BIN
            build/kernel.map
            build/qemu/zvrt/
            kernel/parts/security_policy_format.inc
            tests/security_policy_format_test.cpp
