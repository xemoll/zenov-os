name: ZenovOS Septinum inspired visual integration

on:
  push:
    branches:
      - agent/zenov-os-0.1.1-cohesive-ui-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zenov-septinum-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.head_ref == 'agent/zenov-os-0.1.1-cohesive-ui-polish' || github.ref_name == 'agent/zenov-os-0.1.1-cohesive-ui-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install native toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils openssl qemu-system-x86

      - name: Apply ZenovOS visual transformation
        run: |
          set -euo pipefail
          mkdir -p /tmp/zenov-septinum-evidence
          cp .github/scripts/septinum_v2_visual_pass.py /tmp/septinum_v2_visual_pass.py
          git fetch origin main agent/zenov-os-0.1.1-cohesive-ui-polish
          git rev-parse HEAD | tee /tmp/zenov-septinum-evidence/original-head.txt
          git rev-parse origin/main | tee /tmp/zenov-septinum-evidence/main-head.txt
          python3 /tmp/septinum_v2_visual_pass.py | tee /tmp/zenov-septinum-evidence/transform.log
          rm -f .github/scripts/septinum_v2_visual_pass.py
          git diff --check
          git diff --stat | tee /tmp/zenov-septinum-evidence/source-stat.txt
          git diff --binary > /tmp/zenov-septinum-evidence/worktree.diff
          grep -q 'topbar_x = 18, topbar_y = 8' kernel/parts/ui_graphics_base.inc
          grep -q 'UI_SEPTINUM_V2_OK' kernel/parts/ui_runtime.inc
          grep -q 'launcher_panel_height_for_count' kernel/parts/ui_apps.inc
          grep -q 'ui-launcher-morph-evidence: OK' tests/qemu_display_ui.sh

      - name: Build strict native image
        run: |
          set -o pipefail
          make clean check 2>&1 | tee /tmp/zenov-septinum-evidence/native-check.log

      - name: Run complete persistence and recovery QEMU matrix
        env:
          QEMU_PHASE_TIMEOUT_SECONDS: 180
        run: |
          set -o pipefail
          make qemu 2>&1 | tee /tmp/zenov-septinum-evidence/qemu.log

      - name: Render and verify all 32 display modes
        run: |
          set -o pipefail
          bash tests/qemu_display_ui.sh \
            build/zenov-os.img build/zenov-data.img build/qemu-septinum-v2 \
            2>&1 | tee /tmp/zenov-septinum-evidence/qemu-display.log

      - name: Inspect visual and runtime evidence
        run: |
          set -euo pipefail
          OUT=build/qemu-septinum-v2
          SERIAL="$OUT/serial.log"
          for marker in \
            UI_SEPTINUM_V2_OK UI_LAUNCHER_MORPH_OK UI_SEPTINUM_SHELL_OK \
            UI_WIDESCREEN_CANVAS_OK UI_ADAPTIVE_DISPLAY_OK UI_HYBRID_SCALER_OK \
            'UI_DISPLAY_MODE_COUNT 32' UI_DISPLAY_2K_READY UI_DISPLAY_4K_READY \
            UI_ACCESSIBILITY_OK UI_START_FILTER_OK UI_FRAME_PRESENTED \
            PS2_MOUSE_DECODER_OK WINDOW_DRAG_OK; do
            grep -q "$marker" "$SERIAL"
          done
          test ! -s "$OUT/qemu.stderr"
          grep -q '^full_bottom=' "$OUT/launcher-morph-evidence.txt"
          grep -q '^filtered_bottom=' "$OUT/launcher-morph-evidence.txt"
          grep -q '^delta=' "$OUT/launcher-morph-evidence.txt"
          grep -q '^start bands=' "$OUT/popup-vertical-coverage.txt"
          grep -q '^control-center bands=' "$OUT/popup-vertical-coverage.txt"
          for spec in \
            desktop-1920x1080.ppm:1920:1080 \
            start-1920x1080.ppm:1920:1080 \
            desktop-2560x1440.ppm:2560:1440 \
            control-center-2560x1440.ppm:2560:1440 \
            settings-1024x768.ppm:1024:768 \
            start-search-1024x768.ppm:1024:768; do
            IFS=: read -r file width height <<<"$spec"
            test -s "$OUT/$file"
            test "$(sed -n '2p' "$OUT/$file" | tr -d '\r')" = "$width $height"
          done
          cp "$OUT/serial.log" /tmp/zenov-septinum-evidence/serial.log
          cp "$OUT/qemu.stderr" /tmp/zenov-septinum-evidence/qemu.stderr
          cp "$OUT/framebuffer-sha256.txt" /tmp/zenov-septinum-evidence/framebuffer-sha256.txt
          cp "$OUT/launcher-morph-evidence.txt" /tmp/zenov-septinum-evidence/launcher-morph-evidence.txt
          cp "$OUT/popup-vertical-coverage.txt" /tmp/zenov-septinum-evidence/popup-vertical-coverage.txt
          cp "$OUT/theme-contrast-matrix.txt" /tmp/zenov-septinum-evidence/theme-contrast-matrix.txt

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenov-os-septinum-inspired-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          compression-level: 9
          path: |
            /tmp/zenov-septinum-evidence
            build/qemu-septinum-v2/desktop-1920x1080.ppm
            build/qemu-septinum-v2/start-1920x1080.ppm
            build/qemu-septinum-v2/desktop-2560x1440.ppm
            build/qemu-septinum-v2/control-center-2560x1440.ppm
            build/qemu-septinum-v2/settings-1024x768.ppm
            build/qemu-septinum-v2/start-1024x768.ppm
            build/qemu-septinum-v2/start-search-1024x768.ppm
            build/qemu-septinum-v2/*.txt
            build/qemu-septinum-v2/*.log
            build/qemu-septinum-v2/*.stderr

      - name: Publish one clean production commit
        run: |
          set -euo pipefail
          ORIGINAL_HEAD="$(git rev-parse HEAD)"
          git fetch origin main agent/zenov-os-0.1.1-cohesive-ui-polish
          BASE="$(git merge-base origin/main "$ORIGINAL_HEAD")"
          paths=(
            .github/workflows/adaptive-display.yml
            kernel/parts/graphics_mapping.inc
            kernel/parts/mouse_regression.inc
            kernel/parts/ui_apps.inc
            kernel/parts/ui_files.inc
            kernel/parts/ui_files_runtime.inc
            kernel/parts/ui_font.inc
            kernel/parts/ui_graphics_base.inc
            kernel/parts/ui_runtime.inc
            kernel/parts/ui_scaler.inc
            kernel/parts/ui_shell.inc
            kernel/parts/ui_theme.inc
            tests/qemu_display_ui.sh
            tests/qemu_zenpkg.sh
          )
          git diff --binary "$BASE" -- "${paths[@]}" > /tmp/final-septinum-v2.patch
          test -s /tmp/final-septinum-v2.patch
          git reset --hard origin/main
          git clean -fdx
          git apply --3way /tmp/final-septinum-v2.patch
          git diff HEAD --check
          mapfile -t actual < <(git diff HEAD --name-only | sort)
          mapfile -t expected < <(printf '%s\n' "${paths[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${paths[@]}"
          git diff --cached --check
          git commit -m 'ui: refine ZenovOS with a fluid modular shell'
          FINAL_HEAD="$(git rev-parse HEAD)"
          git log --oneline --decorate -3
          git push --force-with-lease=refs/heads/agent/zenov-os-0.1.1-cohesive-ui-polish:"$ORIGINAL_HEAD" \
            origin HEAD:agent/zenov-os-0.1.1-cohesive-ui-polish
          echo "final-head=$FINAL_HEAD"
