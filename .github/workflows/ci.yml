name: ZenovOS 0.1.1 CI

on:
  pull_request:
    branches: [agent/pr147-sync-trigger-base]
    paths:
      - '.github/workflows/ci.yml'
      - '.agent/merge_pr147_latest_main.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pr147-main-4ebb-sync
  cancel-in-progress: false

jobs:
  merge-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/kernel-preemptive-scheduler-0.1.1
          fetch-depth: 0
          persist-credentials: true
      - name: Run exact semantic merge, verification and publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/sync-pr147-main-fc646
          git show origin/agent/sync-pr147-main-fc646:.agent/merge_pr147_latest_main.sh > /tmp/merge-pr147.sh
          test -s /tmp/merge-pr147.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/merge-pr147.sh')
          text = path.read_text()
          init_needle = '''git add kernel/kernel.cpp

          # Scheduler process ABI plus dynamic user segment rebasing.'''
          init_replacement = '''git add kernel/kernel.cpp
          python3 - <<'PYBOOT'
          from pathlib import Path
          p = Path('kernel/kernel.cpp')
          s = p.read_text()
          old = '    process::init();\\n'
          new = '    process::init();\\n    process::scheduler_init();\\n'
          if s.count(old) != 1:
              raise SystemExit(f'scheduler boot init anchor mismatch count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PYBOOT
          git add kernel/kernel.cpp

          # Scheduler process ABI plus dynamic user segment rebasing.'''
          if text.count(init_needle) != 1:
              raise SystemExit(f'resolver init insertion anchor mismatch count={text.count(init_needle)}')
          text = text.replace(init_needle, init_replacement, 1)
          exit_needle = "grep -Fq 'LINUX_I386_COMPAT_EXIT code=37' build/qemu/foreign-sync/serial.log"
          exit_replacement = "grep -Fq 'LINUX_I386_COMPAT_EXIT code=0' build/qemu/foreign-sync/serial.log\ngrep -Fq 'ZENPKG_FOREIGN_QEMU_OK formats=1 preflight=linux-i386 linux-i386=write+exit+enosys+sandbox probe=zenpkg install=1 run=1 fsck=1' build/qemu/foreign-sync/summary.log"
          if text.count(exit_needle) != 1:
              raise SystemExit(f'Linux fixture exit anchor mismatch count={text.count(exit_needle)}')
          path.write_text(text.replace(exit_needle, exit_replacement, 1))
          PY
          bash -n /tmp/merge-pr147.sh
          bash /tmp/merge-pr147.sh
      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr147-main-sync-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            combined-host-check.log
            build/KERNEL.BIN
            build/kernel.map
            build/qemu/scheduler-sync/**
            build/qemu/foreign-sync/**
