name: ZenovOS 0.1.1 CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  export-exact-scheduler-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bfde85b923674098e67c3c9c350a90739905b04e
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact scheduler head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'bfde85b923674098e67c3c9c350a90739905b04e'
          test -z "$(git status --porcelain)"
          git archive --format=tar.gz --output=scheduler-source-bfde85b.tar.gz HEAD
          test -s scheduler-source-bfde85b.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scheduler-source-bfde85b
          if-no-files-found: error
          retention-days: 1
          path: scheduler-source-bfde85b.tar.gz
