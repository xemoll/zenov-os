name: ZenovOS 0.1.1 CI

on:
  pull_request:
    branches: [agent/pr147-sync-trigger-base]
    paths:
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visible-pr147-main-merge-diagnostic
  cancel-in-progress: true

jobs:
  diagnose-pr147-latest-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/kernel-preemptive-scheduler-0.1.1
          fetch-depth: 0
          persist-credentials: false
      - name: Compute exact merge conflicts
        shell: bash
        env:
          EXPECTED_SCHEDULER: 2755d438ce41e0c3d430a02e7ab8e1c00543f684
          EXPECTED_MAIN: 8defe7147ace8e782afb8341913c09b2c9d594ac
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SCHEDULER"
          git config user.name 'ZenovOS Merge Diagnostic'
          git config user.email 'diagnostic@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          set +e
          git merge --no-ff --no-commit "$EXPECTED_MAIN"
          rc=$?
          set -e
          printf 'MERGE_RC=%s\n' "$rc"
          git status --short | tee merge-status.txt
          git diff --name-only --diff-filter=U | tee conflict-files.txt
          test "$(wc -l < conflict-files.txt)" -eq 5
          mkdir -p conflict-snapshot
          while IFS= read -r path; do
            mkdir -p "conflict-snapshot/$(dirname "$path")"
            cp "$path" "conflict-snapshot/$path"
            git show ":1:$path" > "conflict-snapshot/$path.base"
            git show ":2:$path" > "conflict-snapshot/$path.ours"
            git show ":3:$path" > "conflict-snapshot/$path.theirs"
          done < conflict-files.txt
          git diff --cc > conflict-snapshot/combined.diff
          echo 'PR147_LATEST_MAIN_CONFLICT_SNAPSHOT_OK'
      - name: Upload conflict snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr147-main-8def-conflicts-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 2
          if-no-files-found: error
          path: |
            conflict-snapshot/**
            conflict-files.txt
            merge-status.txt
